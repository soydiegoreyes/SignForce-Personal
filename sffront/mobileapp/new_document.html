<html><head>
<meta charset="utf-8"/>
<link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
<link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B600%3B700&amp;family=Plus+Jakarta+Sans%3Awght%40400%3B500%3B600%3B700%3B800" onload="this.rel='stylesheet'" rel="stylesheet"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style type="text/tailwindcss">
    :root {
      --primary-500: #34d399;
      --primary-600: #10b981;
      --primary-700: #059669;
      --neutral-900: #111827;
      --neutral-800: #1f2937;
      --neutral-700: #374151;
      --neutral-600: #4b5563;
      --neutral-500: #6b7280;
      --neutral-400: #9ca3af;
      --neutral-300: #d1d5db;
      --neutral-200: #e5e7eb;
      --neutral-100: #f3f4f6;
      --neutral-50: #f9fafb;
      --neutral-0: #ffffff;
    }
    body {
      font-family: "Inter", "Plus Jakarta Sans", "Noto Sans", sans-serif;
      background: linear-gradient(180deg, var(--neutral-100) 0%, var(--neutral-0) 100%);
    }
    .step-item:not(:last-child) {
      border-bottom: 1px solid var(--neutral-200);
    }
    .active-gradient {
      background: linear-gradient(180deg, var(--primary-500) 0%, var(--primary-700) 100%);
    }
    .hover-gradient:hover {
      background: linear-gradient(180deg, var(--primary-600) 0%, var(--primary-700) 100%);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gradient-to-b from-neutral-100 to-neutral-0">
<div class="relative flex size-full min-h-screen flex-col justify-between group/design-root overflow-x-hidden">
<header class="bg-transparent sticky top-0 z-10">
<div class="mx-auto max-w-md">
<div class="flex items-center p-4">
<button class="text-neutral-700 hover:text-neutral-900 flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-neutral-200/50 transition-colors">
<svg fill="currentColor" height="24px" viewBox="0 0 24 24" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"></path>
</svg>
</button>
<h1 class="text-neutral-900 text-xl font-semibold leading-tight flex-1 text-center pr-10">Nuevo Documento</h1>
</div>
</div>
</header>
<main class="flex-grow">
<div class="mx-auto max-w-md px-4">
<section class="pt-2 pb-6">
<h2 class="text-neutral-800 text-2xl font-bold leading-tight mb-4">1. Cargar Documento</h2>
<div class="bg-neutral-0 rounded-xl shadow-lg">
<a class="step-item flex items-center gap-4 p-5 hover:bg-neutral-50 transition-colors rounded-xl" href="#">
<div class="text-var(--primary-600) flex items-center justify-center rounded-lg bg-gradient-to-br from-primary-500 to-primary-600 text-white shrink-0 size-12 shadow-md">
<svg fill="currentColor" height="28px" viewBox="0 0 24 24" width="28px" xmlns="http://www.w3.org/2000/svg">
<path d="M9 16V10H5L12 3L19 10H15V16H9ZM5 20V18H19V20H5Z"></path>
</svg>
</div>
<p class="text-neutral-700 text-lg font-medium leading-normal flex-1 truncate">Subir archivo</p>
<svg class="text-neutral-500" fill="currentColor" height="24px" viewBox="0 0 24 24" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M10 6L8.59 7.41L13.17 12L8.59 16.59L10 18L16 12L10 6Z"></path>
</svg>
</a>
</div>
</section>
<section class="py-6">
<h2 class="text-neutral-800 text-2xl font-bold leading-tight mb-4">2. Preparar Documento</h2>
<div class="bg-neutral-0 rounded-xl shadow-lg">
<a class="step-item flex items-center gap-4 p-5 hover:bg-neutral-50 transition-colors rounded-t-xl" href="#">
<div class="text-var(--primary-600) flex items-center justify-center rounded-lg bg-gradient-to-br from-primary-500 to-primary-600 text-white shrink-0 size-12 shadow-md">
<svg fill="currentColor" height="28px" viewBox="0 0 24 24" width="28px" xmlns="http://www.w3.org/2000/svg">
<path d="M15 12C17.21 12 19 10.21 19 8C19 5.79 17.21 4 15 4C12.79 4 11 5.79 11 8C11 10.21 12.79 12 15 12ZM5 10V7H3V10H0V12H3V15H5V12H8V10H5ZM15 14C12.33 14 7 15.33 7 18V20H23V18C23 15.33 17.67 14 15 14Z"></path>
</svg>
</div>
<p class="text-neutral-700 text-lg font-medium leading-normal flex-1 truncate">Añadir firmantes</p>
<svg class="text-neutral-500" fill="currentColor" height="24px" viewBox="0 0 24 24" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M10 6L8.59 7.41L13.17 12L8.59 16.59L10 18L16 12L10 6Z"></path>
</svg>
</a>
<a class="step-item flex items-center gap-4 p-5 hover:bg-neutral-50 transition-colors rounded-b-xl" href="#">
<div class="text-var(--primary-600) flex items-center justify-center rounded-lg bg-gradient-to-br from-primary-500 to-primary-600 text-white shrink-0 size-12 shadow-md">
<svg fill="currentColor" height="28px" viewBox="0 0 24 24" width="28px" xmlns="http://www.w3.org/2000/svg">
<path d="M3 17.25V21H6.75L17.81 9.94L14.06 6.19L3 17.25ZM20.71 7.04C21.1 6.65 21.1 6.02 20.71 5.63L18.37 3.29C17.98 2.9 17.35 2.9 16.96 3.29L15.13 5.12L18.88 8.87L20.71 7.04Z"></path>
</svg>
</div>
<p class="text-neutral-700 text-lg font-medium leading-normal flex-1 truncate">Añadir campos</p>
<svg class="text-neutral-500" fill="currentColor" height="24px" viewBox="0 0 24 24" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M10 6L8.59 7.41L13.17 12L8.59 16.59L10 18L16 12L10 6Z"></path>
</svg>
</a>
</div>
</section>
<section class="py-6">
<h2 class="text-neutral-800 text-2xl font-bold leading-tight mb-4">3. Enviar Documento</h2>
<div class="bg-neutral-0 rounded-xl shadow-lg">
<a class="step-item flex items-center gap-4 p-5 hover:bg-neutral-50 transition-colors rounded-xl" href="#">
<div class="text-var(--primary-600) flex items-center justify-center rounded-lg bg-gradient-to-br from-primary-500 to-primary-600 text-white shrink-0 size-12 shadow-md">
<svg fill="currentColor" height="28px" viewBox="0 0 24 24" width="28px" xmlns="http://www.w3.org/2000/svg">
<path d="M2.01 21L23 12L2.01 3L2 10L17 12L2 14L2.01 21Z"></path>
</svg>
</div>
<p class="text-neutral-700 text-lg font-medium leading-normal flex-1 truncate">Enviar para firma</p>
<svg class="text-neutral-500" fill="currentColor" height="24px" viewBox="0 0 24 24" width="24px" xmlns="http://www.w3.org/2000/svg">
<path d="M10 6L8.59 7.41L13.17 12L8.59 16.59L10 18L16 12L10 6Z"></path>
</svg>
</a>
</div>
</section>
</div>
</main>
<footer class="bg-neutral-0 shadow-[0_-4px_10px_-5px_rgba(0,0,0,0.1)] sticky bottom-0 z-10 border-t border-neutral-200/70">
<div class="mx-auto max-w-md">
<div class="flex p-4">
<button class="active-gradient hover-gradient flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-6 flex-1 text-neutral-0 text-lg font-semibold leading-normal tracking-wide shadow-lg transition-all duration-300 ease-in-out transform hover:scale-[1.02]">
<span class="truncate">Continuar</span>
</button>
</div>
<div class="h-3 bg-neutral-0"></div>
</div>
</footer>
</div>

<link rel="stylesheet" href="/signforce-global.css"><script src="/shared-particles.js"></script>
</body></html>
