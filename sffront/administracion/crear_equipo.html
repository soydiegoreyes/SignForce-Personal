<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Nuevo Equipo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard_styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
</head>
<body>
    <!-- Barra superior -->
    <header class="glass-header" id="mainHeader">
        <div class="flex items-center gap-8 relative">
            <div class="liquid-bubble" id="liquidBubble"></div>
            
            <div class="flex items-center gap-4 text-primary">
                <div class="size-4">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path>
                    </svg>
                </div>
                <h2 class="text-primary text-lg font-bold leading-tight tracking-[-0.015em]">Sistema de Gestión</h2>
            </div>
            <div class="flex items-center gap-9">
                <a class="nav-item text-secondary text-sm font-bold leading-normal transition-colors" href="./../dashboards/dashboard_root.html" data-item="dashboard">Dashboard</a>
                <a class="nav-item text-white text-sm font-bold leading-normal transition-colors" href="#" data-item="create">Crear Equipo</a>
                <a class="nav-item text-secondary text-sm font-bold leading-normal transition-colors" href="#" data-item="settings">Configuración</a>
            </div>
        </div>
        <div class="flex flex-1 justify-end gap-8">
            <div class="user-info flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-emoji-grimace-fill" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M7 6.25C7 5.56 6.552 5 6 5s-1 .56-1 1.25.448 1.25 1 1.25 1-.56 1-1.25m3 1.25c.552 0 1-.56 1-1.25S10.552 5 10 5s-1 .56-1 1.25.448 1.25 1 1.25m1.5 4.5a1.5 1.5 0 0 0 1.48-1.25v-.003a1.5 1.5 0 0 0 0-.497A1.5 1.5 0 0 0 11.5 9h-7a1.5 1.5 0 0 0-1.48 1.25v.003a1.5 1.5 0 0 0 0 .497A1.5 1.5 0 0 0 4.5 12zm-7.969-1.25a1 1 0 0 0 .969.75h.25v-.75zm8.938 0a1 1 0 0 1-.969.75h-.25v-.75zM11.5 9.5a1 1 0 0 1 .969.75H11.25V9.5zm-7.969.75A1 1 0 0 1 4.5 9.5h.25v.75zM5.25 11.5h1v-.75h-1zm2.5 0h-1v-.75h1zm1.5 0h-1v-.75h1zm1.5 0h-1v-.75h1zm-1-2h1v.75h-1zm-1.5 0h1v.75h-1zm-1.5 0h1v.75h-1zm-1.5 0h1v.75h-1z"/>
                </svg>
                <span id="nombreUsuario">Usuario ROOT</span>
            </div>
            <button onclick="logout()" class="btn-secondary">Cerrar Sesión</button>
            <button class="theme-toggle flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-8 bg-white/20 text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5 hover:bg-white/30 hover-glow" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar glass-panel">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-primary">Crear Equipo</h1>
            </div>
            <nav class="flex-1 px-4 py-2">
                <a class="flex items-center gap-3 px-4 py-2 text-secondary rounded-lg hover:bg-white/10" href="./../dashboards/dashboard_root.html">
                    <span class="material-symbols-outlined">arrow_back</span>
                    <span>Volver al Dashboard</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-2 mt-2 text-white bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg" href="#">
                    <span class="material-symbols-outlined">group_add</span>
                    <span>Crear Equipo</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-2 mt-2 text-secondary rounded-lg hover:bg-white/10" href="#">
                    <span class="material-symbols-outlined">settings</span>
                    <span>Configuración</span>
                </a>
            </nav>
        </aside>
        
        <main class="content">
            <div class="glass-panel p-6">
                <h1 class="text-3xl font-bold text-primary mb-6">Crear Nuevo Equipo</h1>
                
                <form id="formCrearEquipo">
                    <div class="form-group">
                        <label for="nombreEquipo">Nombre del Equipo</label>
                        <input type="text" id="nombreEquipo" required>
                        <div class="error text-red-400 mt-1" id="errorNombre"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" rows="3"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="responsable">Responsable Inicial (Usuario Admin)</label>
                        <input type="text" id="responsable" required placeholder="Nombre del responsable">
                        <div class="error text-red-400 mt-1" id="errorResponsable"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="emailResponsable">Email del Responsable</label>
                        <input type="email" id="emailResponsable" required>
                        <div class="error text-red-400 mt-1" id="errorEmail"></div>
                    </div>
                    
                    <div class="actions flex justify-end gap-4 mt-6">
                        <button type="button" class="btn-secondary" onclick="window.location.href='./../dashboards/dashboard_root.html'">Cancelar</button>
                        <button type="submit" class="btn-primary">Crear Equipo</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        // Cargar información del usuario
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));

        /*if (!currentUser || currentUser.tipo !== 'root') {
            console.log("No es root o no hay current user")
            //window.location.href = './../registro/login.html';
        }*/
        // Cargar información de los equipos
        let equipos = JSON.parse(sessionStorage.getItem('equipos')) || [];
        
        // Cargar información de los usuarios
        let usuarios = JSON.parse(sessionStorage.getItem('usuarios')) || [];
        document.getElementById('nombreUsuario').textContent = currentUser.nombre || 'Usuario ROOT';
        
        // Efecto liquid glass para la burbuja del menú
        const liquidBubble = document.getElementById('liquidBubble');
        const navItems = document.querySelectorAll('.nav-item');
        
        const itemPositions = {};
        
        function calculatePositions() {
            navItems.forEach(item => {
                const rect = item.getBoundingClientRect();
                const headerRect = document.getElementById('mainHeader').getBoundingClientRect();
                
                itemPositions[item.dataset.item] = {
                    left: rect.left - headerRect.left,
                    width: rect.width
                };
            });
            
            moveBubble('create');
        }
        
        function moveBubble(itemName) {
            const item = itemPositions[itemName];
            if (item && liquidBubble) {
                liquidBubble.style.left = `${item.left - 10}px`;
                liquidBubble.style.width = `${item.width + 20}px`;
            }
        }
        
        navItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                moveBubble(item.dataset.item);
            });
        });

        window.addEventListener('load', calculatePositions);
        window.addEventListener('resize', calculatePositions);

        // Toggle de tema claro/oscuro
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light-theme');
                
                const icon = themeToggle.querySelector('i');
                if (document.body.classList.contains('light-theme')) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
            });
        }
        
        document.getElementById('formCrearEquipo').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Validación
            let valid = true;
            
            if (!document.getElementById('nombreEquipo').value) {
                document.getElementById('errorNombre').textContent = 'El nombre del equipo es requerido';
                valid = false;
            } else {
                document.getElementById('errorNombre').textContent = '';
            }
            
            if (!document.getElementById('responsable').value) {
                document.getElementById('errorResponsable').textContent = 'El nombre del responsable es requerido';
                valid = false;
            } else {
                document.getElementById('errorResponsable').textContent = '';
            }
            
            if (!document.getElementById('emailResponsable').value) {
                document.getElementById('errorEmail').textContent = 'El email del responsable es requerido';
                valid = false;
            } else {
                document.getElementById('errorEmail').textContent = '';
            }
            
            if (valid) {
                // Crear equipo
                // En un caso real sería un fetch a la API
                /*
                fetch('/api/equipos', {
                    method: 'POST',
                    body: JSON.stringify({
                        nombre: document.getElementById('nombreEquipo').value,
                        descripcion: document.getElementById('descripcion').value,
                        empresaId: currentUser.empresaId,
                        responsable: document.getElementById('responsable').value,
                        emailResponsable: document.getElementById('emailResponsable').value
                    }),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    // Manejar respuesta
                });
                */

                // Crear equipo en memoria
                const nuevoEquipo = {
                    id: `equ_${Date.now()}`,
                    nombre: document.getElementById('nombreEquipo').value,
                    descripcion: document.getElementById('descripcion').value,
                    empresaId: currentUser.empresaId,
                    fechaCreacion: new Date().toISOString(),
                    miembros: []
                };
                
                equipos.push(nuevoEquipo);

                // Crear usuario maestro para el equipo
                const usuarioMaestro = {
                    id: `usr_${Date.now()}`,
                    empresaId: currentUser.empresaId,
                    equipoId: nuevoEquipo.id,
                    email: document.getElementById('emailResponsable').value,
                    password: 'tempPass' + Math.random().toString(36).substring(2, 8),
                    tipo: 'admin_equipo',
                    nombre: document.getElementById('responsable').value
                };
                
                usuarios.push(usuarioMaestro);
                
                // Agregar usuario maestro como miembro del equipo
                nuevoEquipo.miembros.push({
                    usuarioId: usuarioMaestro.id,
                    rol: 'admin',
                    fechaUnion: new Date().toISOString()
                });
                
                // Guardar referencia al usuario maestro en el equipo
                nuevoEquipo.usuarioMaestroEmail = usuarioMaestro.email
                
                sessionStorage.setItem('usuarios', JSON.stringify(usuarios));
                sessionStorage.setItem('equipos', JSON.stringify(equipos));

                // Mostrar mensaje con credenciales
                alert(`Equipo creado exitosamente!\n\nSe ha creado el usuario maestro para este equipo:\n\nEmail: ${usuarioMaestro.email}\nContraseña temporal: ${usuarioMaestro.password}\n\nEstas credenciales han sido enviadas al correo del responsable.`);
                
                // Redirigir al dashboard
                window.location.href = './../dashboards/dashboard_root.html';
            }
        });

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
