<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignForce — Crear Equipo</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <link rel="stylesheet" href="../signforce-global.css">
  <style>
    body{background:#060a14;font-family:'DM Sans',sans-serif;color:#fff;margin:0;min-height:100vh}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.025) 1px,transparent 0);background-size:48px 48px}
    .sf-header{position:fixed;top:3px;left:0;right:0;z-index:1000;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(10,15,30,.85);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.06)}
    .sf-header a{text-decoration:none;color:rgba(255,255,255,.55);font-size:.85rem;font-weight:500;padding:.4rem .8rem;border-radius:8px;transition:all .25s ease;display:inline-flex;align-items:center;gap:6px}
    .sf-header a:hover{color:#fff;background:rgba(255,255,255,.05)}
    .sf-logo-s{width:30px;height:30px;background:#B5C413;color:#0a0f1e;font-weight:900;font-size:.9rem;border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(181,196,19,.2)}
    .sf-logo-text{font-weight:800;font-size:1.1rem;letter-spacing:.05em;color:#fff;margin-left:6px}
    .sf-btn-ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;padding:.4rem 1rem;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .25s ease;display:inline-flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif}
    .sf-btn-ghost:hover{background:rgba(255,255,255,.1);border-color:rgba(181,196,19,.2)}
    .sf-layout{display:flex;min-height:100vh;padding:80px 1.5rem 2rem;gap:1.25rem;position:relative;z-index:1}
    .sf-sidebar{width:250px;flex-shrink:0;display:flex;flex-direction:column;gap:.75rem}
    .sf-sidebar-card{background:rgba(15,21,36,.4);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:1rem}
    .sf-sidebar-title{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.3);padding:.4rem .6rem;font-weight:600;margin-bottom:.25rem}
    .sf-nav-link{display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;border-radius:10px;font-size:.85rem;font-weight:500;color:rgba(255,255,255,.55);border:1px solid transparent;transition:all .25s ease;text-decoration:none;margin-bottom:2px}
    .sf-nav-link:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.04)}
    .sf-nav-link.active{color:#B5C413;background:rgba(181,196,19,.08);border-color:rgba(181,196,19,.12)}
    .sf-content{flex:1;display:flex;flex-direction:column;gap:1.25rem}
    .sf-card{background:rgba(15,21,36,.45);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:1.75rem}
    .sf-card-header{display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem}
    .sf-card-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .sf-card-title{font-size:1.05rem;font-weight:700}
    .sf-input{width:100%;padding:.65rem .85rem;border-radius:10px;font-size:.85rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;font-family:'DM Sans',sans-serif;transition:all .25s ease}
    .sf-input:focus{outline:none;border-color:#B5C413;box-shadow:0 0 0 3px rgba(181,196,19,.1)}
    .sf-input::placeholder{color:rgba(255,255,255,.2)}
    .sf-label{display:block;font-size:.78rem;font-weight:500;color:rgba(255,255,255,.5);margin-bottom:.35rem}
    .sf-btn{padding:.6rem 1.4rem;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .25s ease;border:none;display:inline-flex;align-items:center;gap:8px;font-family:'DM Sans',sans-serif}
    .sf-btn-primary{background:#B5C413;color:#0a0f1e}
    .sf-btn-primary:hover{background:#c5d41a;box-shadow:0 0 24px rgba(181,196,19,.2);transform:translateY(-1px)}
    .sf-team-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:1.25rem;transition:all .3s ease;margin-bottom:.75rem}
    .sf-team-card:hover{border-color:rgba(181,196,19,.15);background:rgba(181,196,19,.03)}
    .sf-team-card h3{font-size:.95rem;font-weight:600;margin-bottom:.3rem}
    .sf-team-card p{font-size:.8rem;color:rgba(255,255,255,.4);margin:0}
    .sf-badge{padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:600;background:rgba(181,196,19,.12);color:#B5C413}
    .sf-empty{text-align:center;padding:2.5rem;color:rgba(255,255,255,.3);font-size:.88rem}
    @media(max-width:900px){.sf-layout{flex-direction:column;padding:75px 1rem 2rem}.sf-sidebar{width:100%}}
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="description" content="SignForce — Plataforma de firma electrónica avanzada con validez legal en México. Cumple NOM-151-SCFI-2016.">
  <meta name="theme-color" content="#060a14">
  <meta property="og:title" content="SignForce — Firma Electrónica Avanzada">
  <meta property="og:description" content="Firma, gestiona y protege documentos electrónicos con validez legal conforme a la NOM-151.">
  <meta property="og:type" content="website">
</head>
<body>
  <div class="sf-bg-orb sf-bg-orb-1"></div><div class="sf-bg-orb sf-bg-orb-2"></div><div class="sf-bg-orb sf-bg-orb-3"></div>

  <!-- SignForce Orbs -->
  <div class="sf-orb sf-orb-1"></div>
  <div class="sf-orb sf-orb-2"></div>
  <div class="sf-orb sf-orb-3"></div>

  <div style="position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#B5C413,#d4e157,#B5C413);z-index:9999;"></div>
  <header class="sf-header">
    <div style="display:flex;align-items:center;gap:1.5rem;">
      <a href="/users" style="color:#fff;"><img src="/images/signforce-logo-new.png" alt="SignForce" style="height:84px;width:auto;"></a>
      <nav style="display:flex;gap:4px;">
        <a href="./../dashboards/dashboard_root.html"><span class="material-symbols-outlined" style="font-size:16px;">dashboard</span> Dashboard</a>
        <a href="#"><span class="material-symbols-outlined" style="font-size:16px;">group_add</span> Equipos</a>
      </nav>
    </div>
    <div style="display:flex;align-items:center;gap:.75rem;">
      <span id="nombreUsuario" style="font-size:.82rem;color:rgba(255,255,255,.45);">Admin</span>
      <button class="sf-btn-ghost" onclick="logout()"><span class="material-symbols-outlined" style="font-size:16px;">logout</span> Salir</button>
    </div>
  </header>

  <div class="sf-layout">
    <aside class="sf-sidebar">
      <div class="sf-sidebar-card" style="padding:1.1rem 1.25rem;">
        <div style="display:flex;align-items:center;gap:.6rem;">
          <div class="sf-card-icon" style="background:rgba(181,196,19,.1);"><span class="material-symbols-outlined" style="font-size:1.1rem;color:#B5C413;">group_add</span></div>
          <div><div style="font-size:.95rem;font-weight:700;">Equipos</div><div style="font-size:.68rem;color:rgba(255,255,255,.35);">Gestión de equipos</div></div>
        </div>
      </div>
      <nav class="sf-sidebar-card" style="flex:1;">
        <div class="sf-sidebar-title">Navegación</div>
        <a class="sf-nav-link" href="./../dashboards/dashboard_root.html"><span class="material-symbols-outlined">arrow_back</span> Dashboard Root</a>
        <a class="sf-nav-link active" href="#"><span class="material-symbols-outlined">group_add</span> Crear Equipo</a>
        <a class="sf-nav-link" href="#"><span class="material-symbols-outlined">groups</span> Ver Equipos</a>
      </nav>
    </aside>

    <main class="sf-content">
      <!-- Form crear equipo -->
      <div class="sf-card">
        <div class="sf-card-header">
          <div class="sf-card-icon" style="background:rgba(181,196,19,.1);"><span class="material-symbols-outlined" style="font-size:1.1rem;color:#B5C413;">add_circle</span></div>
          <div class="sf-card-title">Crear Nuevo Equipo</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:1rem;max-width:500px;">
          <div><label class="sf-label">Nombre del equipo</label><input id="nombreEquipo" class="sf-input" placeholder="Ej: Equipo Legal"></div>
          <div><label class="sf-label">Email del administrador</label><input id="emailAdmin" class="sf-input" type="email" placeholder="admin@empresa.com"></div>
          <div><label class="sf-label">Descripción (opcional)</label><input id="descEquipo" class="sf-input" placeholder="Descripción breve del equipo"></div>
          <button class="sf-btn sf-btn-primary" onclick="crearEquipo()" style="align-self:flex-start;margin-top:.5rem;">
            <span class="material-symbols-outlined" style="font-size:16px;">add</span> Crear Equipo
          </button>
        </div>
      </div>

      <!-- Lista equipos -->
      <div class="sf-card">
        <div class="sf-card-header">
          <div class="sf-card-icon" style="background:rgba(96,165,250,.1);"><span class="material-symbols-outlined" style="font-size:1.1rem;color:#60a5fa;">groups</span></div>
          <div class="sf-card-title">Equipos Existentes</div>
        </div>
        <div id="listaEquipos">
          <div class="sf-empty">
            <span class="material-symbols-outlined" style="font-size:2.5rem;opacity:.3;display:block;margin-bottom:.5rem;">groups</span>
            No hay equipos creados aún.
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
    if(currentUser.nombre) document.getElementById('nombreUsuario').textContent = currentUser.nombre;
    let equipos = JSON.parse(sessionStorage.getItem('equipos') || '[]');

    function crearEquipo(){
      const nombre = document.getElementById('nombreEquipo').value.trim();
      const email = document.getElementById('emailAdmin').value.trim();
      if(!nombre||!email){sfAlert('Nombre y email son requeridos');return}
      const nuevo = {id:'eq_'+Date.now(), instId:currentUser.instId, nombre, usuarioMaestroEmail:email, miembros:[{usuarioId:currentUser.id,rol:'admin',fechaUnion:new Date().toISOString()}]};
      equipos.push(nuevo); sessionStorage.setItem('equipos',JSON.stringify(equipos));
      document.getElementById('nombreEquipo').value=''; document.getElementById('emailAdmin').value=''; document.getElementById('descEquipo').value='';
      sfAlert('Equipo creado exitosamente'); cargarEquipos();
    }
    function cargarEquipos(){
      const container = document.getElementById('listaEquipos');
      const mis = equipos.filter(e=>e.instId===currentUser.instId);
      if(mis.length===0){container.innerHTML='<div class="sf-empty"><span class="material-symbols-outlined" style="font-size:2.5rem;opacity:.3;display:block;margin-bottom:.5rem;">groups</span>No hay equipos creados aún.</div>';return}
      container.innerHTML = mis.map(eq=>`
        <div class="sf-team-card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div><h3>${eq.nombre}</h3><p>Admin: ${eq.usuarioMaestroEmail}</p></div>
            <span class="sf-badge">${eq.miembros?eq.miembros.length:0} miembros</span>
          </div>
        </div>`).join('');
    }
    cargarEquipos();
    async function logout(){sessionStorage.removeItem('currentUser');window.location.href='/login'}
  </script>

  <style>html,body{background:#060a14 !important;background-color:#060a14 !important;}</style>
<script src="/sf-demo-data.js"></script>
<script src="/sf-demo-render.js"></script>
<script src="/sf-modal.js"></script>
<script src="/shared-particles.js"></script>
<script src="/shared-nav.js"></script>
<script>injectSidebar("settings");</script>
</body>
</html>
