<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignForce — Gestión de Usuarios</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <link rel="stylesheet" href="../signforce-global.css">
  <style>
    body{background:#060a14;font-family:'DM Sans',sans-serif;color:#fff;margin:0;min-height:100vh}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.025) 1px,transparent 0);background-size:48px 48px}
    .sf-header{position:fixed;top:3px;left:0;right:0;z-index:1000;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:rgba(10,15,30,.85);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,.06)}
    .sf-header a{text-decoration:none;color:rgba(255,255,255,.55);font-size:.85rem;font-weight:500;padding:.4rem .8rem;border-radius:8px;transition:all .25s ease;display:inline-flex;align-items:center;gap:6px}
    .sf-header a:hover{color:#fff;background:rgba(255,255,255,.05)}
    .sf-logo-s{width:30px;height:30px;background:#B5C413;color:#0a0f1e;font-weight:900;font-size:.9rem;border-radius:8px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(181,196,19,.2)}
    .sf-logo-text{font-weight:800;font-size:1.1rem;letter-spacing:.05em;color:#fff;margin-left:6px}
    .sf-btn-ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#fff;padding:.4rem 1rem;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .25s ease;display:inline-flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif}
    .sf-btn-ghost:hover{background:rgba(255,255,255,.1);border-color:rgba(181,196,19,.2)}
    .sf-layout{display:flex;min-height:100vh;padding:80px 1.5rem 2rem;gap:1.25rem;position:relative;z-index:1}
    .sf-sidebar{width:250px;flex-shrink:0;display:flex;flex-direction:column;gap:.75rem}
    .sf-sidebar-card{background:rgba(15,21,36,.4);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:1rem}
    .sf-sidebar-title{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.3);padding:.4rem .6rem;font-weight:600;margin-bottom:.25rem}
    .sf-nav-link{display:flex;align-items:center;gap:.75rem;padding:.6rem .75rem;border-radius:10px;font-size:.85rem;font-weight:500;color:rgba(255,255,255,.55);border:1px solid transparent;transition:all .25s ease;text-decoration:none;margin-bottom:2px}
    .sf-nav-link:hover{color:rgba(255,255,255,.85);background:rgba(255,255,255,.04)}
    .sf-nav-link.active{color:#B5C413;background:rgba(181,196,19,.08);border-color:rgba(181,196,19,.12)}
    .sf-nav-link .material-symbols-outlined{font-size:1.15rem}
    .sf-content{flex:1;display:flex;flex-direction:column;gap:1.25rem}
    .sf-card{background:rgba(15,21,36,.45);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:1.75rem}
    .sf-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
    .sf-card-header-left{display:flex;align-items:center;gap:.75rem}
    .sf-card-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .sf-card-title{font-size:1.05rem;font-weight:700}
    .sf-table{width:100%;border-collapse:collapse;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.04)}
    .sf-table thead tr{background:rgba(255,255,255,.03)}
    .sf-table th{padding:.65rem 1rem;text-align:left;font-size:.7rem;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.06)}
    .sf-table td{padding:.65rem 1rem;border-bottom:1px solid rgba(255,255,255,.04);color:rgba(255,255,255,.6);font-size:.85rem}
    .sf-table tr:hover td{background:rgba(255,255,255,.02)}
    .sf-badge{padding:4px 10px;border-radius:20px;font-size:.68rem;font-weight:600;display:inline-flex;align-items:center;gap:4px}
    .sf-badge-green{background:rgba(181,196,19,.12);color:#B5C413}
    .sf-badge-blue{background:rgba(96,165,250,.12);color:#60a5fa}
    .sf-btn{padding:.5rem 1.2rem;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .25s ease;border:none;display:inline-flex;align-items:center;gap:6px;font-family:'DM Sans',sans-serif}
    .sf-btn-primary{background:#B5C413;color:#0a0f1e}
    .sf-btn-primary:hover{background:#c5d41a;box-shadow:0 0 20px rgba(181,196,19,.2)}
    .sf-btn-sm{padding:.35rem .7rem;font-size:.75rem;border-radius:6px;cursor:pointer;border:none;transition:all .2s ease;font-family:'DM Sans',sans-serif}
    .sf-btn-edit{background:rgba(96,165,250,.12);color:#60a5fa}.sf-btn-edit:hover{background:rgba(96,165,250,.2)}
    .sf-btn-del{background:rgba(248,113,113,.1);color:#f87171}.sf-btn-del:hover{background:rgba(248,113,113,.2)}
    .sf-btn-promo{background:rgba(181,196,19,.1);color:#B5C413}.sf-btn-promo:hover{background:rgba(181,196,19,.2)}
    .modal{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.7);backdrop-filter:blur(5px)}
    .modal-content{background:rgba(10,15,30,.96);border:1px solid rgba(255,255,255,.08);border-radius:20px;margin:8% auto;padding:2rem;width:90%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:slideIn .3s ease}
    @keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
    .close-modal{color:rgba(255,255,255,.4);cursor:pointer;font-size:1.5rem;transition:.2s}.close-modal:hover{color:#fff}
    .form-group{margin-bottom:1rem}
    .form-group label{display:block;font-size:.78rem;font-weight:500;color:rgba(255,255,255,.5);margin-bottom:.35rem}
    .form-group input,.form-group select{width:100%;padding:.6rem .85rem;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:.85rem;font-family:'DM Sans',sans-serif;transition:all .25s ease}
    .form-group input:focus,.form-group select:focus{outline:none;border-color:#B5C413;box-shadow:0 0 0 3px rgba(181,196,19,.1)}
    .form-group select option{background:#0f1524;color:#fff}
    @media(max-width:900px){.sf-layout{flex-direction:column;padding:75px 1rem 2rem}.sf-sidebar{width:100%}}
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="description" content="SignForce — Plataforma de firma electrónica avanzada con validez legal en México. Cumple NOM-151-SCFI-2016.">
  <meta name="theme-color" content="#060a14">
  <meta property="og:title" content="SignForce — Firma Electrónica Avanzada">
  <meta property="og:description" content="Firma, gestiona y protege documentos electrónicos con validez legal conforme a la NOM-151.">
  <meta property="og:type" content="website">
</head>
<body>
  <!-- SignForce Orbs -->
  <div class="sf-orb sf-orb-1"></div>
  <div class="sf-orb sf-orb-2"></div>
  <div class="sf-orb sf-orb-3"></div>

  <div style="position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#B5C413,#d4e157,#B5C413);z-index:9999;"></div>
  <header class="sf-header">
    <div style="display:flex;align-items:center;gap:1.5rem;">
      <a href="/" style="color:#fff;"><img src="/images/signforce-logo.png" alt="SignForce" style="height:32px;width:auto;"></a>
      <nav style="display:flex;gap:4px;">
        <a href="./../dashboards/dashboard_admin.html"><span class="material-symbols-outlined" style="font-size:16px;">dashboard</span> Dashboard</a>
        <a href="#"><span class="material-symbols-outlined" style="font-size:16px;">group</span> Usuarios</a>
      </nav>
    </div>
    <div style="display:flex;align-items:center;gap:.75rem;">
      <span id="nombreUsuario" style="font-size:.82rem;color:rgba(255,255,255,.45);">Admin</span>
      <button class="sf-btn-ghost" onclick="logout()"><span class="material-symbols-outlined" style="font-size:16px;">logout</span> Salir</button>
    </div>
  </header>

  <div class="sf-layout">
    <aside class="sf-sidebar">
      <div class="sf-sidebar-card" style="padding:1.1rem 1.25rem;">
        <div style="display:flex;align-items:center;gap:.6rem;">
          <div class="sf-card-icon" style="background:rgba(96,165,250,.1);"><span class="material-symbols-outlined" style="font-size:1.1rem;color:#60a5fa;">group</span></div>
          <div><div style="font-size:.95rem;font-weight:700;">Usuarios</div><div style="font-size:.68rem;color:rgba(255,255,255,.35);">Gestión del equipo</div></div>
        </div>
      </div>
      <nav class="sf-sidebar-card" style="flex:1;">
        <div class="sf-sidebar-title">Navegación</div>
        <a class="sf-nav-link" href="./../dashboards/dashboard_admin.html"><span class="material-symbols-outlined">arrow_back</span> Volver al Dashboard</a>
        <a class="sf-nav-link active" href="#"><span class="material-symbols-outlined">group</span> Gestionar Usuarios</a>
        <a class="sf-nav-link" href="#"><span class="material-symbols-outlined">settings</span> Configuración</a>
      </nav>
    </aside>

    <main class="sf-content">
      <div class="sf-card">
        <div class="sf-card-header">
          <div class="sf-card-header-left">
            <div class="sf-card-icon" style="background:rgba(96,165,250,.1);"><span class="material-symbols-outlined" style="font-size:1.1rem;color:#60a5fa;">group</span></div>
            <div class="sf-card-title">Usuarios del Equipo</div>
          </div>
          <button class="sf-btn sf-btn-primary" onclick="abrirModalAgregar()"><span class="material-symbols-outlined" style="font-size:16px;">person_add</span> Agregar Usuario</button>
        </div>
        <table class="sf-table" id="tablaUsuarios">
          <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th>Acciones</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Modal Agregar -->
  <div id="modalAgregar" class="modal">
    <div class="modal-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
        <h3 style="font-size:1.1rem;font-weight:700;margin:0;">Agregar Nuevo Usuario</h3>
        <span class="close-modal" onclick="cerrarModalAgregar()">&times;</span>
      </div>
      <form id="formAgregarUsuario">
        <div class="form-group"><label>Nombre</label><input type="text" id="nombreNuevoUsuario" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="emailNuevoUsuario" required></div>
        <div class="form-group"><label>Rol</label><select id="rolNuevoUsuario" required><option value="miembro">Miembro</option><option value="admin">Administrador</option></select></div>
        <div style="display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.25rem;">
          <button type="button" class="sf-btn-ghost" onclick="cerrarModalAgregar()">Cancelar</button>
          <button type="submit" class="sf-btn sf-btn-primary">Agregar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Editar -->
  <div id="modalEditar" class="modal">
    <div class="modal-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;">
        <h3 style="font-size:1.1rem;font-weight:700;margin:0;">Editar Usuario</h3>
        <span class="close-modal" onclick="cerrarModalEditar()">&times;</span>
      </div>
      <form id="formEditarUsuario">
        <input type="hidden" id="usuarioIdEditar">
        <div class="form-group"><label>Nombre</label><input type="text" id="nombreEditarUsuario" required></div>
        <div class="form-group"><label>Email</label><input type="email" id="emailEditarUsuario" required></div>
        <div class="form-group"><label>Rol</label><select id="rolEditarUsuario" required><option value="miembro">Miembro</option><option value="admin">Administrador</option></select></div>
        <div style="display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.25rem;">
          <button type="button" class="sf-btn-ghost" onclick="cerrarModalEditar()">Cancelar</button>
          <button type="submit" class="sf-btn sf-btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const currentUser = JSON.parse(sessionStorage.getItem('currentUser') || '{}');
    let equipos = JSON.parse(sessionStorage.getItem('equipos') || '[]');
    let usuarios = JSON.parse(sessionStorage.getItem('usuarios') || '[]');
    if(currentUser.nombre) document.getElementById('nombreUsuario').textContent = currentUser.nombre;
    const modalAgregar = document.getElementById('modalAgregar');
    const modalEditar = document.getElementById('modalEditar');

    function cargarUsuarios(){
      const equipo = equipos.find(e => e.id === currentUser.equipoId);
      if(!equipo||!equipo.miembros) return;
      const tbody = document.querySelector('#tablaUsuarios tbody'); tbody.innerHTML='';
      equipo.miembros.forEach(m => {
        const u = usuarios.find(x => x.id === m.usuarioId); if(!u) return;
        const tr = document.createElement('tr');
        const isAdmin = m.rol==='admin';
        tr.innerHTML=`
          <td style="color:#fff;font-weight:500;">${u.nombre}</td>
          <td>${u.email}</td>
          <td><span class="sf-badge ${isAdmin?'sf-badge-green':'sf-badge-blue'}">${isAdmin?'ADMIN':'MIEMBRO'}</span></td>
          <td>${u.id!==currentUser.id?`
            <button class="sf-btn-sm sf-btn-edit" onclick="editarUsuario('${u.id}')">Editar</button>
            <button class="sf-btn-sm sf-btn-del" onclick="eliminarUsuario('${u.id}')">Eliminar</button>
            ${!isAdmin?`<button class="sf-btn-sm sf-btn-promo" onclick="promoverAAdmin('${u.id}')">Admin</button>`:''}`
            :'<span style="color:rgba(255,255,255,.3);font-size:.78rem;">Tú</span>'}</td>`;
        tbody.appendChild(tr);
      });
    }
    cargarUsuarios();

    function abrirModalAgregar(){modalAgregar.style.display='block'}
    function cerrarModalAgregar(){modalAgregar.style.display='none';document.getElementById('formAgregarUsuario').reset()}
    function cerrarModalEditar(){modalEditar.style.display='none'}
    window.onclick=e=>{if(e.target===modalAgregar)cerrarModalAgregar();if(e.target===modalEditar)cerrarModalEditar()};

    document.getElementById('formAgregarUsuario').addEventListener('submit',e=>{
      e.preventDefault();
      const nombre=document.getElementById('nombreNuevoUsuario').value,email=document.getElementById('emailNuevoUsuario').value,rol=document.getElementById('rolNuevoUsuario').value;
      if(usuarios.some(u=>u.email===email)){alert('Email ya registrado');return}
      const nu={id:`usr_${Date.now()}`,nombre,email,password:'temp'+Math.random().toString(36).substr(2,8),tipo:'miembro_equipo',empresaId:currentUser.empresaId,equipoId:currentUser.equipoId};
      usuarios.push(nu);sessionStorage.setItem('usuarios',JSON.stringify(usuarios));
      const eq=equipos.find(e=>e.id===currentUser.equipoId);eq.miembros.push({usuarioId:nu.id,rol,fechaUnion:new Date().toISOString()});
      sessionStorage.setItem('equipos',JSON.stringify(equipos));
      alert(`Usuario agregado!\nEmail: ${nu.email}\nPass: ${nu.password}`);cerrarModalAgregar();cargarUsuarios();
    });

    document.getElementById('formEditarUsuario').addEventListener('submit',e=>{
      e.preventDefault();
      const id=document.getElementById('usuarioIdEditar').value,u=usuarios.find(x=>x.id===id);
      if(u){u.nombre=document.getElementById('nombreEditarUsuario').value;u.email=document.getElementById('emailEditarUsuario').value;
        const eq=equipos.find(e=>e.id===currentUser.equipoId),m=eq.miembros.find(x=>x.usuarioId===id);
        if(m)m.rol=document.getElementById('rolEditarUsuario').value;
        sessionStorage.setItem('equipos',JSON.stringify(equipos));alert('Actualizado');cerrarModalEditar();cargarUsuarios();}
    });

    function editarUsuario(id){
      const u=usuarios.find(x=>x.id===id),eq=equipos.find(e=>e.id===currentUser.equipoId),m=eq.miembros.find(x=>x.usuarioId===id);
      if(u){document.getElementById('usuarioIdEditar').value=u.id;document.getElementById('nombreEditarUsuario').value=u.nombre;
        document.getElementById('emailEditarUsuario').value=u.email;document.getElementById('rolEditarUsuario').value=m.rol;modalEditar.style.display='block';}
    }
    function eliminarUsuario(id){if(confirm('¿Eliminar usuario del equipo?')){const eq=equipos.find(e=>e.id===currentUser.equipoId);eq.miembros=eq.miembros.filter(m=>m.usuarioId!==id);sessionStorage.setItem('equipos',JSON.stringify(equipos));cargarUsuarios()}}
    function promoverAAdmin(id){if(confirm('¿Promover a admin?')){const eq=equipos.find(e=>e.id===currentUser.equipoId),m=eq.miembros.find(x=>x.usuarioId===id),u=usuarios.find(x=>x.id===id);if(m){m.rol='admin';u.tipo='admin_equipo';sessionStorage.setItem('equipos',JSON.stringify(equipos));sessionStorage.setItem('usuarios',JSON.stringify(usuarios));cargarUsuarios()}}}
    function logout(){sessionStorage.removeItem('currentUser');window.location.href='/login'}
  </script>

  <style>html,body{background:#060a14 !important;background-color:#060a14 !important;}</style>
<script src="/shared-particles.js"></script>
<script src="/shared-nav.js"></script>
<script>injectSidebar("settings");</script>
</body>
</html>
