<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios del Equipo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="dashboard_styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
</head>
<body>
    <!-- Barra superior -->
    <header class="glass-header" id="mainHeader">
        <div class="flex items-center gap-8 relative">
            <div class="liquid-bubble" id="liquidBubble"></div>
            
            <div class="flex items-center gap-4 text-primary">
                <div class="size-4">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"></path>
                    </svg>
                </div>
                <h2 class="text-primary text-lg font-bold leading-tight tracking-[-0.015em]">Sistema de Gestión</h2>
            </div>
            <div class="flex items-center gap-9">
                <a class="nav-item text-secondary text-sm font-bold leading-normal transition-colors" href="./../dashboards/dashboard_admin.html" data-item="dashboard">Dashboard</a>
                <a class="nav-item text-white text-sm font-bold leading-normal transition-colors" href="#" data-item="users">Usuarios</a>
                <a class="nav-item text-secondary text-sm font-bold leading-normal transition-colors" href="#" data-item="settings">Configuración</a>
            </div>
        </div>
        <div class="flex flex-1 justify-end gap-8">
            <div class="user-info flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-emoji-grimace-fill" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M7 6.25C7 5.56 6.552 5 6 5s-1 .56-1 1.25.448 1.25 1 1.25 1-.56 1-1.25m3 1.25c.552 0 1-.56 1-1.25S10.552 5 10 5s-1 .56-1 1.25.448 1.25 1 1.25m1.5 4.5a1.5 1.5 0 0 0 1.48-1.25v-.003a1.5 1.5 0 0 0 0-.497A1.5 1.5 0 0 0 11.5 9h-7a1.5 1.5 0 0 0-1.48 1.25v.003a1.5 1.5 0 0 0 0 .497A1.5 1.5 0 0 0 4.5 12zm-7.969-1.25a1 1 0 0 0 .969.75h.25v-.75zm8.938 0a1 1 0 0 1-.969.75h-.25v-.75zM11.5 9.5a1 1 0 0 1 .969.75H11.25V9.5zm-7.969.75A1 1 0 0 1 4.5 9.5h.25v.75zM5.25 11.5h1v-.75h-1zm2.5 0h-1v-.75h1zm1.5 0h-1v-.75h1zm1.5 0h-1v-.75h1zm-1-2h1v.75h-1zm-1.5 0h1v.75h-1zm-1.5 0h1v.75h-1zm-1.5 0h1v.75h-1z"/>
                </svg>
                <span id="nombreUsuario">Administrador de Equipo</span>
            </div>
            <button onclick="logout()" class="btn-secondary">Cerrar Sesión</button>
            <button class="theme-toggle flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-8 bg-white/20 text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5 hover:bg-white/30 hover-glow" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar glass-panel">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-primary">Gestión de Usuarios</h1>
            </div>
            <nav class="flex-1 px-4 py-2">
                <a class="flex items-center gap-3 px-4 py-2 text-secondary rounded-lg hover:bg-white/10" href="./../dashboards/dashboard_admin.html">
                    <span class="material-symbols-outlined">arrow_back</span>
                    <span>Volver al Dashboard</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-2 mt-2 text-white bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg" href="#">
                    <span class="material-symbols-outlined">group</span>
                    <span>Gestionar Usuarios</span>
                </a>
                <a class="flex items-center gap-3 px-4 py-2 mt-2 text-secondary rounded-lg hover:bg-white/10" href="#">
                    <span class="material-symbols-outlined">settings</span>
                    <span>Configuración</span>
                </a>
            </nav>
        </aside>
        
        <main class="content">
            <div class="actions mb-6 flex justify-between items-center">
                <button class="btn-secondary" onclick="window.location.href='./../dashboards/dashboard_admin.html'">
                    <span class="material-symbols-outlined mr-2" style="vertical-align: middle;">arrow_back</span>
                    Volver al Dashboard
                </button>
                <button class="btn-primary" onclick="abrirModalAgregar()">
                    <span class="material-symbols-outlined mr-2" style="vertical-align: middle;">person_add</span>
                    Agregar Usuario
                </button>
            </div>
            
            <div class="glass-panel p-6">
                <h1 class="text-3xl font-bold text-primary mb-6">Gestión de Usuarios del Equipo</h1>
                
                <div class="overflow-x-auto">
                    <table id="tablaUsuarios" class="w-full">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Rol</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Los usuarios se cargarán dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Modal para agregar usuario -->
    <div id="modalAgregar" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModalAgregar()">&times;</span>
            <h2 class="text-2xl font-bold text-primary mb-4">Agregar Nuevo Usuario</h2>
            <form id="formAgregarUsuario">
                <div class="form-group">
                    <label for="nombreNuevoUsuario">Nombre</label>
                    <input type="text" id="nombreNuevoUsuario" required>
                </div>
                <div class="form-group">
                    <label for="emailNuevoUsuario">Email</label>
                    <input type="email" id="emailNuevoUsuario" required>
                </div>
                <div class="form-group">
                    <label for="rolNuevoUsuario">Rol</label>
                    <select id="rolNuevoUsuario" required>
                        <option value="miembro">Miembro</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="flex justify-end gap-4 mt-6">
                    <button type="button" class="btn-secondary" onclick="cerrarModalAgregar()">Cancelar</button>
                    <button type="submit" class="btn-primary">Agregar Usuario</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Modal para editar usuario -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="cerrarModalEditar()">&times;</span>
            <h2 class="text-2xl font-bold text-primary mb-4">Editar Usuario</h2>
            <form id="formEditarUsuario">
                <input type="hidden" id="usuarioIdEditar">
                <div class="form-group">
                    <label for="nombreEditarUsuario">Nombre</label>
                    <input type="text" id="nombreEditarUsuario" required>
                </div>
                <div class="form-group">
                    <label for="emailEditarUsuario">Email</label>
                    <input type="email" id="emailEditarUsuario" required>
                </div>
                <div class="form-group">
                    <label for="rolEditarUsuario">Rol</label>
                    <select id="rolEditarUsuario" required>
                        <option value="miembro">Miembro</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div class="flex justify-end gap-4 mt-6">
                    <button type="button" class="btn-secondary" onclick="cerrarModalEditar()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Cargar información del usuario
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        
        /*if (!currentUser || currentUser.tipo !== 'admin_equipo') {
            console.log("Usuario no es admin o no usuario ")
            //window.location.href = './../registro/login.html';
        }*/
        
        document.getElementById('nombreUsuario').textContent = currentUser.nombre || 'Administrador de Equipo';
        
        // Cargar información de los equipos
        let equipos = JSON.parse(sessionStorage.getItem('equipos')) || [];

        // Cargar informacion de los usuarios
         let usuarios = JSON.parse(sessionStorage.getItem('usuarios')) || [];

        // Efecto liquid glass para la burbuja del menú
        const liquidBubble = document.getElementById('liquidBubble');
        const navItems = document.querySelectorAll('.nav-item');
        
        const itemPositions = {};
        
        function calculatePositions() {
            navItems.forEach(item => {
                const rect = item.getBoundingClientRect();
                const headerRect = document.getElementById('mainHeader').getBoundingClientRect();
                
                itemPositions[item.dataset.item] = {
                    left: rect.left - headerRect.left,
                    width: rect.width
                };
            });
            
            moveBubble('users');
        }
        
        function moveBubble(itemName) {
            const item = itemPositions[itemName];
            if (item && liquidBubble) {
                liquidBubble.style.left = `${item.left - 10}px`;
                liquidBubble.style.width = `${item.width + 20}px`;
            }
        }
        
        navItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                moveBubble(item.dataset.item);
            });
        });

        window.addEventListener('load', calculatePositions);
        window.addEventListener('resize', calculatePositions);

        // Toggle de tema claro/oscuro
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light-theme');
                
                const icon = themeToggle.querySelector('i');
                if (document.body.classList.contains('light-theme')) {
                    icon.classList.remove('fa-moon');
                    icon.classList.add('fa-sun');
                } else {
                    icon.classList.remove('fa-sun');
                    icon.classList.add('fa-moon');
                }
            });
        }

        // Variables para modales
        const modalAgregar = document.getElementById('modalAgregar');
        const modalEditar = document.getElementById('modalEditar');
        
        // Cargar usuarios del equipo
        function cargarUsuarios() {
            // Buscar equipo en memoria
            const equipo = equipos.find(e => e.id === currentUser.equipoId);
            // Determinar si el usuario actual puede editar este miembro
            const puedeEditar = (currentUser.tipo === 'admin_equipo');
            
            if (equipo && equipo.miembros) {
                const tbody = document.querySelector('#tablaUsuarios tbody');
                tbody.innerHTML = '';
                
                equipo.miembros.forEach(miembro => {
                    // Buscar información del usuario
                    const usuario = usuarios.find(u => u.id === miembro.usuarioId);
                    
                    if (usuario) {
                        const tr = document.createElement('tr');
                        tr.className = 'glass-card fade-in';
                        
                        // Determinar clase del badge según el rol
                        let badgeClass, rolText;
                        if (miembro.rol === 'admin') {
                            badgeClass = 'badge-admin';
                            rolText = 'ADMIN';
                        } else if (miembro.rol === 'miembro') {
                            badgeClass = 'badge-miembro';
                            rolText = 'MIEMBRO';
                        }
                        
                        tr.innerHTML = `
                            <td class="text-primary font-medium">${usuario.nombre}</td>
                            <td class="text-secondary">${usuario.email}</td>
                            <td><span class="badge ${badgeClass}">${rolText}</span></td>
                            <td>
                                ${usuario.id !== currentUser.id ? `
                                <button class="action-btn btn-editar" onclick="editarUsuario('${usuario.id}')">Editar</button>
                                <button class="action-btn btn-eliminar" onclick="eliminarUsuario('${usuario.id}')">Eliminar</button>
                                ${miembro.rol !== 'admin' ? `
                                    <button class="action-btn btn-promover" onclick="promoverAAdmin('${usuario.id}')">Hacer Admin</button>
                                    ` : ''}
                                ` : '<span class="text-secondary">Tú</span>'}
                            </td>
                        `;
                        
                        tbody.appendChild(tr);
                    }
                });
            }
        }
        
        cargarUsuarios();
        
        // Funciones para modales
        function abrirModalAgregar() {
            modalAgregar.style.display = 'block';
        }
        
        function cerrarModalAgregar() {
            modalAgregar.style.display = 'none';
            document.getElementById('formAgregarUsuario').reset();
        }
        
        function abrirModalEditar(usuarioId) {
            // Buscar usuario
            const usuario = usuarios.find(u => u.id === usuarioId);
            
            if (usuario) {
                // Buscar información de miembro
                const equipo = equipos.find(e => e.id === currentUser.equipoId);
                const miembro = equipo.miembros.find(m => m.usuarioId === usuarioId);
                
                document.getElementById('usuarioIdEditar').value = usuario.id;
                document.getElementById('nombreEditarUsuario').value = usuario.nombre;
                document.getElementById('emailEditarUsuario').value = usuario.email;
                document.getElementById('rolEditarUsuario').value = miembro.rol;
                
                modalEditar.style.display = 'block';
            }
        }
        
        function cerrarModalEditar() {
            modalEditar.style.display = 'none';
        }
        
        // Cerrar modales al hacer clic fuera de ellos
        window.onclick = function(event) {
            if (event.target === modalAgregar) {
                cerrarModalAgregar();
            }
            if (event.target === modalEditar) {
                cerrarModalEditar();
            }
        };
        
        // Formulario para agregar usuario
        document.getElementById('formAgregarUsuario').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombreNuevoUsuario').value;
            const email = document.getElementById('emailNuevoUsuario').value;
            const rol = document.getElementById('rolNuevoUsuario').value;
            
            // Validar que el email no esté ya en uso
            const emailEnUso = usuarios.some(u => u.email === email);
            
            if (emailEnUso) {
                alert('Este email ya está registrado en el sistema');
                return;
            }
            
            // Crear nuevo usuario
            // En un caso real sería un fetch a la API
            /*
            fetch('/api/usuarios', {
                method: 'POST',
                body: JSON.stringify({
                    nombre,
                    email,
                    password: 'temp' + Math.random().toString(36).substring(2, 8),
                    tipo: 'miembro_equipo',
                    empresaId: currentUser.empresaId,
                    equipoId: currentUser.equipoId,
                    rol
                }),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                // Manejar respuesta
            });
            */
            
            const nuevoUsuario = {
                id: `usr_${Date.now()}`,
                nombre,
                email,
                password: 'temp' + Math.random().toString(36).substring(2, 8),
                tipo: 'miembro_equipo',
                empresaId: currentUser.empresaId,
                equipoId: currentUser.equipoId
            };
            
            usuarios.push(nuevoUsuario);
            sessionStorage.setItem('usuarios', JSON.stringify(usuarios));

            // Agregar usuario al equipo
            const equipo = equipos.find(e => e.id === currentUser.equipoId);
            equipo.miembros.push({
                usuarioId: nuevoUsuario.id,
                rol,
                fechaUnion: new Date().toISOString()
            });
            sessionStorage.setItem('equipos', JSON.stringify(equipos));

            // Mostrar mensaje con credenciales
            alert(`Usuario agregado exitosamente!\n\nEmail: ${nuevoUsuario.email}\nContraseña temporal: ${nuevoUsuario.password}\n\nEstas credenciales han sido enviadas al correo del usuario.`);
            
            // Cerrar modal y recargar lista
            cerrarModalAgregar();
            cargarUsuarios();
        });
        
        // Formulario para editar usuario
        document.getElementById('formEditarUsuario').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usuarioId = document.getElementById('usuarioIdEditar').value;
            const nombre = document.getElementById('nombreEditarUsuario').value;
            const email = document.getElementById('emailEditarUsuario').value;
            const rol = document.getElementById('rolEditarUsuario').value;
            
            // Actualizar usuario
            // En un caso real sería un fetch a la API
            /*
            fetch(`/api/usuarios/${usuarioId}`, {
                method: 'PUT',
                body: JSON.stringify({ nombre, email, rol }),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                // Manejar respuesta
            });
            */
            
            // Actualizar en memoria
            const usuario = usuarios.find(u => u.id === usuarioId);
            if (usuario) {
                usuario.nombre = nombre;
                usuario.email = email;
                
                // Actualizar rol en el equipo
                const equipo = equipos.find(e => e.id === currentUser.equipoId);
                const miembro = equipo.miembros.find(m => m.usuarioId === usuarioId);
                if (miembro) {
                    miembro.rol = rol;
                }
                sessionStorage.setItem('equipos', JSON.stringify(equipos));
                
                alert('Usuario actualizado exitosamente');
                cerrarModalEditar();
                cargarUsuarios();
            }
        });
        
        // Funciones para acciones
        function editarUsuario(usuarioId) {
            abrirModalEditar(usuarioId);
        }
        
        function eliminarUsuario(usuarioId) {
            if (confirm('¿Estás seguro de que deseas eliminar este usuario del equipo?')) {
                // En un caso real sería un fetch a la API
                /*
                fetch(`/api/equipos/${currentUser.equipoId}/miembros/${usuarioId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    // Manejar respuesta
                });
                */
                
                // Eliminar de memoria
                const equipo = equipos.find(e => e.id === currentUser.equipoId);
                equipo.miembros = equipo.miembros.filter(m => m.usuarioId !== usuarioId);
                sessionStorage.setItem('equipos', JSON.stringify(equipos));
                // No eliminamos el usuario completamente, solo del equipo
                alert('Usuario eliminado del equipo');
                cargarUsuarios();
            }
        }
        
        function promoverAAdmin(usuarioId) {
            if (confirm('¿Promover este usuario a administrador del equipo?')) {
                // En un caso real sería un fetch a la API
                /*
                fetch(`/api/equipos/${currentUser.equipoId}/miembros/${usuarioId}/promover`, {
                    method: 'PUT',
                    body: JSON.stringify({ rol: 'admin' }),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    // Manejar respuesta
                });
                */
                
                // Actualizar en memoria
                const equipo = equipos.find(e => e.id === currentUser.equipoId);
                const miembro = equipo.miembros.find(m => m.usuarioId === usuarioId);
                const usu= usuarios.find(u => u.id === usuarioId);
                if (miembro) {
                    miembro.rol = 'admin';
                    usu.tipo = 'admin_equipo'
                    alert('Usuario promovido a administrador');
                    cargarUsuarios();
                }
                sessionStorage.setItem('equipos', JSON.stringify(equipos));
                sessionStorage.setItem('usuarios', JSON.stringify(usuarios));
            }
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
