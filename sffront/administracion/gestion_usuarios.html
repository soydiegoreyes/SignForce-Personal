<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios del Equipo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="gestion_usuarios.css">
</head>
<body>
    <div class="header">
        <div class="logo">Sistema de Gestión</div>
        <div class="user-info">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-emoji-grimace-fill" viewBox="0 0 16 16">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M7 6.25C7 5.56 6.552 5 6 5s-1 .56-1 1.25.448 1.25 1 1.25 1-.56 1-1.25m3 1.25c.552 0 1-.56 1-1.25S10.552 5 10 5s-1 .56-1 1.25.448 1.25 1 1.25m1.5 4.5a1.5 1.5 0 0 0 1.48-1.25v-.003a1.5 1.5 0 0 0 0-.497A1.5 1.5 0 0 0 11.5 9h-7a1.5 1.5 0 0 0-1.48 1.25v.003a1.5 1.5 0 0 0 0 .497A1.5 1.5 0 0 0 4.5 12zm-7.969-1.25a1 1 0 0 0 .969.75h.25v-.75zm8.938 0a1 1 0 0 1-.969.75h-.25v-.75zM11.5 9.5a1 1 0 0 1 .969.75H11.25V9.5zm-7.969.75A1 1 0 0 1 4.5 9.5h.25v.75zM5.25 11.5h1v-.75h-1zm2.5 0h-1v-.75h1zm1.5 0h-1v-.75h1zm1.5 0h-1v-.75h1zm-1-2h1v.75h-1zm-1.5 0h1v.75h-1zm-1.5 0h1v.75h-1zm-1.5 0h1v.75h-1z"/>
            </svg>
            <span id="nombreUsuario">Administrador de Equipo</span>
        </div>
    </div>
    
    <div class="container">
        <div class="card">
            <div class="actions">
                <button class="btn btn-volver" onclick="window.location.href='./../dashboards/dashboard_admin.html'">Volver al Dashboard</button>
                <button class="btn btn-agregar" onclick="abrirModalAgregar()">Agregar Usuario</button>
            </div>
            
            <h1>Gestión de Usuarios del Equipo</h1>
            
            <table id="tablaUsuarios">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Los usuarios se cargarán dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>
    
    <!-- Modal para agregar usuario -->
    <div id="modalAgregar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalAgregar()">&times;</span>
            <h2>Agregar Nuevo Usuario</h2>
            <form id="formAgregarUsuario">
                <div class="form-group">
                    <label for="nombreNuevoUsuario">Nombre</label>
                    <input type="text" id="nombreNuevoUsuario" required>
                </div>
                <div class="form-group">
                    <label for="emailNuevoUsuario">Email</label>
                    <input type="email" id="emailNuevoUsuario" required>
                </div>
                <div class="form-group">
                    <label for="rolNuevoUsuario">Rol</label>
                    <select id="rolNuevoUsuario" required>
                        <option value="miembro">Miembro</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn">Agregar Usuario</button>
            </form>
        </div>
    </div>
    
    <!-- Modal para editar usuario -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModalEditar()">&times;</span>
            <h2>Editar Usuario</h2>
            <form id="formEditarUsuario">
                <input type="hidden" id="usuarioIdEditar">
                <div class="form-group">
                    <label for="nombreEditarUsuario">Nombre</label>
                    <input type="text" id="nombreEditarUsuario" required>
                </div>
                <div class="form-group">
                    <label for="emailEditarUsuario">Email</label>
                    <input type="email" id="emailEditarUsuario" required>
                </div>
                <div class="form-group">
                    <label for="rolEditarUsuario">Rol</label>
                    <select id="rolEditarUsuario" required>
                        <option value="miembro">Miembro</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn">Guardar Cambios</button>
            </form>
        </div>
    </div>

    <script>
        // Cargar información del usuario
        const currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
        
        if (!currentUser || currentUser.tipo !== 'admin_equipo') {
            window.location.href = './../registro/login.html';
        }
        
        document.getElementById('nombreUsuario').textContent = currentUser.nombre || 'Administrador de Equipo';
        
        // Cargar información de los equipos
        let equipos = JSON.parse(sessionStorage.getItem('equipos')) || [];

        // Cargar informacion de los usuarios
         let usuarios = JSON.parse(sessionStorage.getItem('usuarios')) || [];

        // Variables para modales
        const modalAgregar = document.getElementById('modalAgregar');
        const modalEditar = document.getElementById('modalEditar');
        
        // Cargar usuarios del equipo
        function cargarUsuarios() {
            // Buscar equipo en memoria
            const equipo = equipos.find(e => e.id === currentUser.equipoId);
            // Determinar si el usuario actual puede editar este miembro
            const puedeEditar = (currentUser.tipo === 'admin_equipo');
            
            if (equipo && equipo.miembros) {
                const tbody = document.querySelector('#tablaUsuarios tbody');
                tbody.innerHTML = '';
                
                equipo.miembros.forEach(miembro => {
                    // Buscar información del usuario
                    const usuario = usuarios.find(u => u.id === miembro.usuarioId);
                    
                    if (usuario) {
                        const tr = document.createElement('tr');
                        
                        // Determinar clase del badge según el rol
                        let badgeClass, rolText;
                        if (miembro.rol === 'admin') {
                            badgeClass = 'badge-admin';
                            rolText = 'ADMIN';
                        } else if (miembro.rol === 'miembro') {
                            badgeClass = 'badge-miembro';
                            rolText = 'MIEMBRO';
                        }
                        
                        tr.innerHTML = `
                            <td>${usuario.nombre}</td>
                            <td>${usuario.email}</td>
                            <td><span class="badge ${badgeClass}">${rolText}</span></td>
                            <td>
                                ${usuario.id !== currentUser.id ? `
                                <button class="action-btn btn-editar" onclick="editarUsuario('${usuario.id}')">Editar</button>
                                <button class="action-btn btn-eliminar" onclick="eliminarUsuario('${usuario.id}')">Eliminar</button>
                                ${miembro.rol !== 'admin' ? `
                                    <button class="action-btn btn-promover" onclick="promoverAAdmin('${usuario.id}')">Hacer Admin</button>
                                    ` : ''}
                                ` : ''}
                            </td>
                        `;
                        
                        tbody.appendChild(tr);
                    }
                });
            }
        }
        
        cargarUsuarios();
        
        // Funciones para modales
        function abrirModalAgregar() {
            modalAgregar.style.display = 'block';
        }
        
        function cerrarModalAgregar() {
            modalAgregar.style.display = 'none';
        }
        
        function abrirModalEditar(usuarioId) {
            // Buscar usuario
            const usuario = usuarios.find(u => u.id === usuarioId);
            
            if (usuario) {
                // Buscar información de miembro
                const equipo = equipos.find(e => e.id === currentUser.equipoId);
                const miembro = equipo.miembros.find(m => m.usuarioId === usuarioId);
                
                document.getElementById('usuarioIdEditar').value = usuario.id;
                document.getElementById('nombreEditarUsuario').value = usuario.nombre;
                document.getElementById('emailEditarUsuario').value = usuario.email;
                document.getElementById('rolEditarUsuario').value = miembro.rol;
                
                modalEditar.style.display = 'block';
            }
        }
        
        function cerrarModalEditar() {
            modalEditar.style.display = 'none';
        }
        
        // Cerrar modales al hacer clic fuera de ellos
        window.onclick = function(event) {
            if (event.target === modalAgregar) {
                cerrarModalAgregar();
            }
            if (event.target === modalEditar) {
                cerrarModalEditar();
            }
        };
        
        // Formulario para agregar usuario
        document.getElementById('formAgregarUsuario').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombreNuevoUsuario').value;
            const email = document.getElementById('emailNuevoUsuario').value;
            const rol = document.getElementById('rolNuevoUsuario').value;
            
            // Validar que el email no esté ya en uso
            const emailEnUso = usuarios.some(u => u.email === email);
            
            if (emailEnUso) {
                alert('Este email ya está registrado en el sistema');
                return;
            }
            
            // Crear nuevo usuario
            // En un caso real sería un fetch a la API
            /*
            fetch('/api/usuarios', {
                method: 'POST',
                body: JSON.stringify({
                    nombre,
                    email,
                    password: 'temp' + Math.random().toString(36).substring(2, 8),
                    tipo: 'miembro_equipo',
                    empresaId: currentUser.empresaId,
                    equipoId: currentUser.equipoId,
                    rol
                }),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                // Manejar respuesta
            });
            */
            
            const nuevoUsuario = {
                id: `usr_${Date.now()}`,
                nombre,
                email,
                password: 'temp' + Math.random().toString(36).substring(2, 8),
                tipo: 'miembro_equipo',
                empresaId: currentUser.empresaId,
                equipoId: currentUser.equipoId
            };
            
            usuarios.push(nuevoUsuario);
            sessionStorage.setItem('usuarios', JSON.stringify(usuarios));

            // Agregar usuario al equipo
            const equipo = equipos.find(e => e.id === currentUser.equipoId);
            equipo.miembros.push({
                usuarioId: nuevoUsuario.id,
                rol,
                fechaUnion: new Date().toISOString()
            });
            sessionStorage.setItem('equipos', JSON.stringify(equipos));

            // Mostrar mensaje con credenciales
            alert(`Usuario agregado exitosamente!\n\nEmail: ${nuevoUsuario.email}\nContraseña temporal: ${nuevoUsuario.password}\n\nEstas credenciales han sido enviadas al correo del usuario.`);
            
            // Cerrar modal y recargar lista
            cerrarModalAgregar();
            cargarUsuarios();
        });
        
        // Formulario para editar usuario
        document.getElementById('formEditarUsuario').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const usuarioId = document.getElementById('usuarioIdEditar').value;
            const nombre = document.getElementById('nombreEditarUsuario').value;
            const email = document.getElementById('emailEditarUsuario').value;
            const rol = document.getElementById('rolEditarUsuario').value;
            
            // Actualizar usuario
            // En un caso real sería un fetch a la API
            /*
            fetch(`/api/usuarios/${usuarioId}`, {
                method: 'PUT',
                body: JSON.stringify({ nombre, email, rol }),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                // Manejar respuesta
            });
            */
            
            // Actualizar en memoria
            const usuario = usuarios.find(u => u.id === usuarioId);
            if (usuario) {
                usuario.nombre = nombre;
                usuario.email = email;
                
                // Actualizar rol en el equipo
                const equipo = equipos.find(e => e.id === currentUser.equipoId);
                const miembro = equipo.miembros.find(m => m.usuarioId === usuarioId);
                if (miembro) {
                    miembro.rol = rol;
                }
                sessionStorage.setItem('equipos', JSON.stringify(equipos));
                
                alert('Usuario actualizado exitosamente');
                cerrarModalEditar();
                cargarUsuarios();
            }
        });
        
        // Funciones para acciones
        function editarUsuario(usuarioId) {
            abrirModalEditar(usuarioId);
        }
        
        function eliminarUsuario(usuarioId) {
            if (confirm('¿Estás seguro de que deseas eliminar este usuario del equipo?')) {
                // En un caso real sería un fetch a la API
                /*
                fetch(`/api/equipos/${currentUser.equipoId}/miembros/${usuarioId}`, {
                    method: 'DELETE'
                })
                .then(response => response.json())
                .then(data => {
                    // Manejar respuesta
                });
                */
                
                // Eliminar de memoria
                const equipo = equipos.find(e => e.id === currentUser.equipoId);
                equipo.miembros = equipo.miembros.filter(m => m.usuarioId !== usuarioId);
                sessionStorage.setItem('equipos', JSON.stringify(equipos));
                // No eliminamos el usuario completamente, solo del equipo
                alert('Usuario eliminado del equipo');
                cargarUsuarios();
            }
        }
        
        function promoverAAdmin(usuarioId) {
            if (confirm('¿Promover este usuario a administrador del equipo?')) {
                // En un caso real sería un fetch a la API
                /*
                fetch(`/api/equipos/${currentUser.equipoId}/miembros/${usuarioId}/promover`, {
                    method: 'PUT',
                    body: JSON.stringify({ rol: 'admin' }),
                    headers: {
                        'Content-Type': 'application/json'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    // Manejar respuesta
                });
                */
                
                // Actualizar en memoria
                const equipo = equipos.find(e => e.id === currentUser.equipoId);
                const miembro = equipo.miembros.find(m => m.usuarioId === usuarioId);
                const usu= usuarios.find(u => u.id === usuarioId);
                if (miembro) {
                    miembro.rol = 'admin';
                    usu.tipo = 'admin_equipo'
                    alert('Usuario promovido a administrador');
                    cargarUsuarios();
                }
                sessionStorage.setItem('equipos', JSON.stringify(equipos));
                sessionStorage.setItem('usuarios', JSON.stringify(usuarios));
            }
        }
    </script>
</body>
</html>
