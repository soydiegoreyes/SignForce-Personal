<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Documentos - SignForce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Michroma:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Variables del sistema de colores */
        :root {
            --color-background: #060a14;
            --color-card: rgba(255, 255, 255, 0.03);
            --color-text-primary: #f3f4f6;
            --color-text-secondary: #9ca3af;
            --color-accent: rgba(59, 130, 246, 0.5);
            --color-accent-purple: rgba(124, 58, 237, 0.5);
            --color-success: rgba(16, 185, 129, 0.7);
            --color-error: rgba(239, 68, 68, 0.7);
            --color-warning: rgba(245, 158, 11, 0.7);
            --color-info: rgba(59, 130, 246, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--color-background);
            color: var(--color-text-primary);
            min-height: 100vh;
        }

        /* Header estilo view_signature */
        .header-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
            height: 64px;
        }

        .header-content {
            height: 100%;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1920px;
            margin: 0 auto;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: bold;
            color: white;
            font-family: 'DM Sans', sans-serif;
        }

        .logo-subtext {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-left: 4px;
        }

        /* Contenido principal */
        .main-content {
            margin-top: 96px;
            padding: 24px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }

        /* Tarjetas estilo tech-card */
        .tech-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .tech-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
            opacity: 0.5;
        }

        .tech-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        /* Títulos */
        h1, h2, h3, h4 {
            font-family: 'DM Sans', sans-serif;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #f3f4f6, #9ca3af, #6b7280);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h3 {
            font-size: 1.5rem;
            margin-bottom: 24px;
            color: white;
        }

        /* Formulario y controles */
        .form-container {
            padding: 32px;
        }

        .doc-type-selector {
            margin-bottom: 32px;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-secondary);
            margin-bottom: 8px;
            display: block;
        }

        .select-field {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .select-field:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.7); /* Borde azul al enfocar */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); /* Sombra azul sutil */
            color: #ffffff; /* Texto blanco puro al enfocar */
        }

        .select-field:hover{
            background: rgb(12, 0, 36);
        }

        /* Si quieres que el input se vea aún más oscuro cuando no está enfocado */
        .select-field:not(:focus) {
            background: linear-gradient(45deg, 
                rgba(59, 130, 246, 0.3), 
                rgba(124, 58, 237, 0.3), 
                rgba(59, 130, 246, 0.3));
            color: #ffffff; /* Texto blanco puro al enfocar */
        }

        /* Drop zone mejorada */
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 48px 32px;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(59, 130, 246, 0.3), 
                rgba(124, 58, 237, 0.3), 
                rgba(59, 130, 246, 0.3));
            border-radius: 14px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drop-zone:hover::before,
        .drop-zone.dragover::before {
            opacity: 1;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: transparent;
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-4px);
        }

        .drop-zone-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .drop-zone-icon {
            font-size: 4rem;
            color: var(--color-accent);
        }

        .drop-zone-text {
            color: var(--color-text-secondary);
        }

        .drop-zone-text p {
            margin: 8px 0;
        }

        .drop-zone-text strong {
            color: var(--color-text-primary);
            font-weight: 600;
        }

        /* Botones estilo cyber */
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-upload {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-upload:hover {
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--color-success), #10b981);
            color: white;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px 32px;
            font-size: 1rem;
        }

        .btn-submit:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: rgba(156, 163, 175, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Lista de archivos */
        .files-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .file-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .file-icon {
            color: var(--color-accent);
            font-size: 1.25rem;
        }

        .file-details {
            flex: 1;
            overflow: hidden;
        }

        .file-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: white;
        }

        .file-size {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-top: 4px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
            transition: all 0.3s ease;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.5);
        }

        /* Barra de progreso */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--color-success), #10b981);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Mensajes */
        .message-container {
            margin-bottom: 24px;
        }

        .error {
            color: #fca5a5;
            padding: 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            margin-bottom: 16px;
            backdrop-filter: blur(12px);
        }

        .success {
            color: #a7f3d0;
            padding: 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            margin-bottom: 16px;
            backdrop-filter: blur(12px);
        }

        .info {
            color: #93c5fd;
            padding: 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            margin-bottom: 16px;
            backdrop-filter: blur(12px);
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        /* Spinner */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                margin-top: 80px;
                padding: 16px;
            }

            h1 {
                font-size: 2rem;
            }

            h3 {
                font-size: 1.25rem;
            }

            .form-container {
                padding: 24px;
            }

            .drop-zone {
                padding: 32px 16px;
            }

            .drop-zone-icon {
                font-size: 3rem;
            }

            .file-name {
                max-width: 200px;
            }
        }

        @media (max-width: 480px) {
            .header-content {
                padding: 0 16px;
            }

            .logo-text {
                font-size: 1rem;
            }

            .file-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .file-actions {
                align-self: flex-end;
            }

            .btn {
                width: 100%;
            }
        }
    
    /* ═══ SignForce Design Override ═══ */

      border-radius:14px !important; transition:all .3s ease; }
    .glass-card:hover { background:rgba(181,196,19,.04) !important; border-color:rgba(181,196,19,.15) !important; transform:translateY(-2px); }
    .sidebar, aside { background:rgba(10,15,30,.5) !important; }
    .sidebar nav a[class*="bg-gradient"], aside nav a[class*="bg-gradient"] {
      background:rgba(181,196,19,.08) !important; color:#B5C413 !important; border:1px solid rgba(181,196,19,.12) !important; }
    .btn-primary, .btn { background:#B5C413 !important; color:#0a0f1e !important; font-weight:700; border-radius:10px !important; border:none; }
    .btn-primary:hover, .btn:hover { background:#c5d41a !important; box-shadow:0 0 24px rgba(181,196,19,.2) !important; }

    .input-field, input[type="text"], input[type="email"], input[type="password"], input[type="tel"],
    input[type="date"], input[type="file"], textarea, select {
      background:rgba(255,255,255,.04) !important; border:1px solid rgba(255,255,255,.08) !important;
      color:#fff !important; border-radius:10px !important; font-family:'DM Sans',sans-serif; }
    input:focus, textarea:focus, select:focus, .input-field:focus {
      outline:none !important; border-color:#B5C413 !important; box-shadow:0 0 0 3px rgba(181,196,19,.1) !important; }
    input::placeholder, textarea::placeholder { color:rgba(255,255,255,.2) !important; }
    select option { background:#0f1524; color:#fff; }
    table { width:100%; border-collapse:collapse; }
    th { background:rgba(255,255,255,.03) !important; font-size:.7rem; font-weight:600; color:rgba(255,255,255,.4);
      text-transform:uppercase; letter-spacing:.08em; padding:.65rem 1rem; border-bottom:1px solid rgba(255,255,255,.06); }
    td { padding:.65rem 1rem; border-bottom:1px solid rgba(255,255,255,.04); color:rgba(255,255,255,.6); font-size:.85rem; }
    tr:hover td { background:rgba(255,255,255,.02); }
    .badge { padding:4px 10px; border-radius:20px; font-size:.68rem; font-weight:600; }
    .action-card { background:rgba(15,21,36,.4) !important; border:1px solid rgba(255,255,255,.06) !important;
      border-radius:20px !important; cursor:pointer; transition:all .3s ease; }
    .action-card:hover { border-color:rgba(181,196,19,.15) !important; transform:translateY(-3px); }
    .modal { display:none; position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,.7); backdrop-filter:blur(5px); }
    .modal-content { background:rgba(10,15,30,.96) !important; border:1px solid rgba(255,255,255,.08) !important;
      border-radius:20px !important; }
    .close-modal { color:rgba(255,255,255,.4); cursor:pointer; transition:.2s; }
    .close-modal:hover { color:#fff; }
    .spinner { border:3px solid rgba(255,255,255,.08); border-top-color:#B5C413; border-radius:50%;
      width:30px; height:30px; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .bg { background:none !important; }
    .main-container, .content, main { position:relative; z-index:1; }
    .hover-glow:hover { box-shadow:0 0 15px rgba(181,196,19,.12) !important; }
    .text-primary { color:#fff !important; }
    .text-secondary { color:rgba(255,255,255,.55) !important; }
    .drag-drop-area { border:2px dashed rgba(181,196,19,.2) !important; background:rgba(181,196,19,.03) !important; border-radius:16px; }
    .drag-drop-area:hover { border-color:rgba(181,196,19,.35) !important; }
    .footer, footer { background:rgba(10,15,30,.4) !important; border:1px solid rgba(255,255,255,.04) !important; border-radius:14px; }
    
    /* Hero gradient line on panels */
    .glass-panel { position: relative !important; overflow: hidden; }
    .glass-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(181,196,19,.2), transparent);
      pointer-events: none; z-index: 1;
    }
    .glass-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(181,196,19,.1), transparent);
      pointer-events: none;
    }

    /* end override */

    </style>

  <meta name="theme-color" content="#060a14">
  <meta property="og:title" content="SignForce — Firma Electrónica Avanzada">

<body>
    <div class="top-accent"></div>
  <!-- SignForce Orbs -->
  <div class="sf-orb sf-orb-1"></div>
  <div class="sf-orb sf-orb-2"></div>
  <div class="sf-orb sf-orb-3"></div>

    <!-- Header -->
    <header class="header-panel">
        <div class="header-content">
            <div class="logo-container">
                
                <div>
                    <img src="./../images/sflogo.png" alt="Logo" style="width: 10%;"/>
                    <span class="logo-subtext">Subir Documentos</span>
                </div>
            </div>
            <div>
                <a href="/mydocs" class="btn info" style="padding: 8px 16px;">
                    Mis Documentos
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <div class="main-content">
        <h1 class="animate-fade-in">Subir Documentos</h1>
        
        <div id="messageContainer" class="message-container"></div>
        
        <div class="tech-card animate-fade-in">
            <div class="form-container">
                <h3>Selecciona y arrastra tus documentos</h3>
                
                <div class="doc-type-selector">
                    <label for="documentType" class="info-label">Tipo de documento:</label>
                    <select id="documentType" class="select-field" required>
                        <option value="">Selecciona un tipo</option>
                        <option value="generic">Documento Genérico</option>
                        <option value="template">Plantilla de contrato</option>
                    </select>
                </div>
                
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-content">
                        <i class="fas fa-cloud-upload-alt drop-zone-icon"></i>
                        <div class="drop-zone-text">
                            <p><strong>Haz clic para seleccionar</strong> o arrastra tus archivos aquí</p>
                            <p>Formatos aceptados: PDF, DOC, DOCX, JPG, JPEG, PNG</p>
                        </div>
                        <div class="file-input-container">
                            <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style="display: none;">
                            <label for="fileInput" class="btn btn-upload">
                                <i class="fas fa-folder-open"></i>
                                Seleccionar archivos
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="files-list" id="filesList">
                    <!-- Los archivos se mostrarán aquí -->
                </div>
                
                <div class="actions" style="text-align: center;">
                    <button class="btn btn-submit" id="btnSubmit" disabled>
                        <i class="fas fa-upload"></i>
                        Subir documentos
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/documentflow/upload_zone.js"></script>

  <style>html,body{background:#060a14 !important;background-color:#060a14 !important;}</style>
</body>
</html>
