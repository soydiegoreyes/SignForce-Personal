<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Documentos - SignForce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Michroma:wght@400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Variables del sistema de colores */
        :root {
            --color-background: #0f172a;
            --color-card: rgba(255, 255, 255, 0.03);
            --color-text-primary: #f3f4f6;
            --color-text-secondary: #9ca3af;
            --color-accent: rgba(59, 130, 246, 0.5);
            --color-accent-purple: rgba(124, 58, 237, 0.5);
            --color-success: rgba(16, 185, 129, 0.7);
            --color-error: rgba(239, 68, 68, 0.7);
            --color-warning: rgba(245, 158, 11, 0.7);
            --color-info: rgba(59, 130, 246, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--color-background);
            color: var(--color-text-primary);
            min-height: 100vh;
        }

        /* Header estilo view_signature */
        .header-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 50;
            height: 64px;
        }

        .header-content {
            height: 100%;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1920px;
            margin: 0 auto;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: bold;
            color: white;
            font-family: 'Michroma', sans-serif;
        }

        .logo-subtext {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-left: 4px;
        }

        /* Contenido principal */
        .main-content {
            margin-top: 96px;
            padding: 24px;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }

        /* Tarjetas estilo tech-card */
        .tech-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .tech-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
            opacity: 0.5;
        }

        .tech-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        /* Títulos */
        h1, h2, h3, h4 {
            font-family: 'Michroma', sans-serif;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #f3f4f6, #9ca3af, #6b7280);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h3 {
            font-size: 1.5rem;
            margin-bottom: 24px;
            color: white;
        }

        /* Formulario y controles */
        .form-container {
            padding: 32px;
        }

        .doc-type-selector {
            margin-bottom: 32px;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-secondary);
            margin-bottom: 8px;
            display: block;
        }

        .select-field {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .select-field:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.7); /* Borde azul al enfocar */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); /* Sombra azul sutil */
            color: #ffffff; /* Texto blanco puro al enfocar */
        }

        .select-field:hover{
            background: rgb(12, 0, 36);
        }

        /* Si quieres que el input se vea aún más oscuro cuando no está enfocado */
        .select-field:not(:focus) {
            background: linear-gradient(45deg, 
                rgba(59, 130, 246, 0.3), 
                rgba(124, 58, 237, 0.3), 
                rgba(59, 130, 246, 0.3));
            color: #ffffff; /* Texto blanco puro al enfocar */
        }

        /* Drop zone mejorada */
        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 48px 32px;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .drop-zone::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(59, 130, 246, 0.3), 
                rgba(124, 58, 237, 0.3), 
                rgba(59, 130, 246, 0.3));
            border-radius: 14px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drop-zone:hover::before,
        .drop-zone.dragover::before {
            opacity: 1;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: transparent;
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-4px);
        }

        .drop-zone-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .drop-zone-icon {
            font-size: 4rem;
            color: var(--color-accent);
        }

        .drop-zone-text {
            color: var(--color-text-secondary);
        }

        .drop-zone-text p {
            margin: 8px 0;
        }

        .drop-zone-text strong {
            color: var(--color-text-primary);
            font-weight: 600;
        }

        /* Botones estilo cyber */
        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-upload {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-upload:hover {
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--color-success), #10b981);
            color: white;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px 32px;
            font-size: 1rem;
        }

        .btn-submit:hover:not(:disabled) {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-submit:disabled {
            background: rgba(156, 163, 175, 0.5);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Lista de archivos */
        .files-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 32px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .file-item:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        .file-icon {
            color: var(--color-accent);
            font-size: 1.25rem;
        }

        .file-details {
            flex: 1;
            overflow: hidden;
        }

        .file-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: white;
        }

        .file-size {
            font-size: 0.85rem;
            color: var(--color-text-secondary);
            margin-top: 4px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
            transition: all 0.3s ease;
        }

        .btn-remove:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.5);
        }

        /* Barra de progreso */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, var(--color-success), #10b981);
            border-radius: 3px;
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Mensajes */
        .message-container {
            margin-bottom: 24px;
        }

        .error {
            color: #fca5a5;
            padding: 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            margin-bottom: 16px;
            backdrop-filter: blur(12px);
        }

        .success {
            color: #a7f3d0;
            padding: 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            margin-bottom: 16px;
            backdrop-filter: blur(12px);
        }

        .info {
            color: #93c5fd;
            padding: 16px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            margin-bottom: 16px;
            backdrop-filter: blur(12px);
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        /* Spinner */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                margin-top: 80px;
                padding: 16px;
            }

            h1 {
                font-size: 2rem;
            }

            h3 {
                font-size: 1.25rem;
            }

            .form-container {
                padding: 24px;
            }

            .drop-zone {
                padding: 32px 16px;
            }

            .drop-zone-icon {
                font-size: 3rem;
            }

            .file-name {
                max-width: 200px;
            }
        }

        @media (max-width: 480px) {
            .header-content {
                padding: 0 16px;
            }

            .logo-text {
                font-size: 1rem;
            }

            .file-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .file-actions {
                align-self: flex-end;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header-panel">
        <div class="header-content">
            <div class="logo-container">
                <div class="size-12">
                    <img src="./../images/sflogo.png" alt="Logo" />
                </div>
                <div>
                    <span class="logo-text">SignForce</span>
                    <span class="logo-subtext">Subir Documentos</span>
                </div>
            </div>
            <div>
                <a href="/mydocs" class="btn info" style="padding: 8px 16px;">
                    Mis Documentos
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <div class="main-content">
        <h1 class="animate-fade-in">Subir Documentos</h1>
        
        <div id="messageContainer" class="message-container"></div>
        
        <div class="tech-card animate-fade-in">
            <div class="form-container">
                <h3>Selecciona y arrastra tus documentos</h3>
                
                <div class="doc-type-selector">
                    <label for="documentType" class="info-label">Tipo de documento:</label>
                    <select id="documentType" class="select-field" required>
                        <option value="">Selecciona un tipo</option>
                        <option value="generic">Documento Genérico</option>
                        <option value="template">Plantilla de contrato</option>
                    </select>
                </div>
                
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-content">
                        <i class="fas fa-cloud-upload-alt drop-zone-icon"></i>
                        <div class="drop-zone-text">
                            <p><strong>Haz clic para seleccionar</strong> o arrastra tus archivos aquí</p>
                            <p>Formatos aceptados: PDF, DOC, DOCX, JPG, JPEG, PNG</p>
                        </div>
                        <div class="file-input-container">
                            <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" style="display: none;">
                            <label for="fileInput" class="btn btn-upload">
                                <i class="fas fa-folder-open"></i>
                                Seleccionar archivos
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="files-list" id="filesList">
                    <!-- Los archivos se mostrarán aquí -->
                </div>
                
                <div class="actions" style="text-align: center;">
                    <button class="btn btn-submit" id="btnSubmit" disabled>
                        <i class="fas fa-upload"></i>
                        Subir documentos
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            // Configurar la zona de drag & drop
            configurarDragAndDrop();
            
            // Configurar el botón de envío
            document.getElementById('btnSubmit').addEventListener('click', subirArchivos);
        });

        //===================================== DRAG & DROP =========================================
        function configurarDragAndDrop() {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');

            // 1. SOLUCIÓN AL DOBLE CLIC:
            // Usamos una bandera para evitar que el evento se propague infinitamente
            dropZone.addEventListener('click', (e) => {
                // Si el clic vino directamente del input, no hacemos nada más
                if (e.target === fileInput) return;
                
                // Evitamos que el clic del div haga cosas raras
                e.preventDefault();
                
                // Antes de abrir, verificamos el tipo de documento
                const documentType = document.getElementById('documentType').value;
                if (!documentType) {
                    mostrarMensaje('Por favor, selecciona un tipo de documento primero', 'error');
                    return;
                }

                fileInput.click();
            });

            // 2. SOLUCIÓN AL "NO CARGA LA SEGUNDA VEZ":
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    handleFiles(this.files);
                    
                    // Limpiamos el valor del input esto permite que si el usuario elige el mismo archivo
                    // el evento 'change' se vuelva a disparar siempre.
                    this.value = ''; 
                }
            });

            // Prevenir comportamientos por defecto
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            // Efectos visuales
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
            });

            dropZone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                handleFiles(dt.files);
            }, false);
        }
        
        // Archivos seleccionados para subir
        let archivosParaSubir = [];
        
        function handleFiles(files) {
            if (files.length === 0) return;
            
            // Verificar que se haya seleccionado un tipo de documento
            const documentType = document.getElementById('documentType').value;
            if (!documentType) {
                mostrarMensaje('Por favor, selecciona un tipo de documento primero', 'error');
                return;
            }
            
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                
                // Verificar si el archivo ya está en la lista
                if (archivosParaSubir.some(f => f.name === file.name && f.size === file.size)) {
                    continue;
                }
                
                // Añadir a la lista
                archivosParaSubir.push(file);
                
                // Mostrar en la interfaz
                mostrarArchivoEnLista(file);
            }
            
            // Habilitar el botón de subir si hay archivos
            document.getElementById('btnSubmit').disabled = archivosParaSubir.length === 0;
        }
        
        function mostrarArchivoEnLista(file) {
            const filesList = document.getElementById('filesList');
            const fileId = 'file-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            
            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.id = fileId;
            
            // Formatear tamaño del archivo
            const fileSize = formatFileSize(file.size);
            
            fileItem.innerHTML = `
                <div class="file-info">
                    <i class="fas fa-file file-icon"></i>
                    <div class="file-details">
                        <div class="file-name" title="${file.name}">${file.name}</div>
                        <div class="file-size">${fileSize}</div>
                        <div class="progress-bar">
                            <div class="progress" id="progress-${fileId}"></div>
                        </div>
                    </div>
                </div>
                <div class="file-actions">
                    <button class="btn btn-remove" onclick="eliminarArchivo('${fileId}', '${file.name}', ${file.size})">
                        <i class="fas fa-times"></i>
                        Eliminar
                    </button>
                </div>
            `;
            
            filesList.appendChild(fileItem);
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function eliminarArchivo(fileId, fileName, fileSize) {
            // Eliminar de la lista visual
            const fileElement = document.getElementById(fileId);
            if (fileElement) {
                fileElement.remove();
            }
            
            // Eliminar del array de archivos
            archivosParaSubir = archivosParaSubir.filter(file => 
                !(file.name === fileName && file.size === fileSize)
            );
            
            // Deshabilitar el botón si no hay archivos
            document.getElementById('btnSubmit').disabled = archivosParaSubir.length === 0;
        }
        
        //===================================== UPLOAD FILES =========================================
        async function subirArchivos() {
            const documentType = document.getElementById('documentType').value;
            if (!documentType) {
                mostrarMensaje('Por favor, selecciona un tipo de documento', 'error');
                return;
            }
            
            if (archivosParaSubir.length === 0) {
                mostrarMensaje('No hay archivos para subir', 'error');
                return;
            }
            
            try {
                mostrarMensaje('Subiendo archivos...', 'info');
                document.getElementById('btnSubmit').disabled = true;
                document.getElementById('btnSubmit').innerHTML = '<span class="loading"></span> Subiendo...';
                
                const formData = new FormData();
                
                // Añadir el tipo de documento
                formData.append('documentType', documentType);
                
                // Añadir todos los archivos (usando el mismo campo 'document' que espera tu backend)
                for (let i = 0; i < archivosParaSubir.length; i++) {
                    formData.append('document', archivosParaSubir[i]);
                }
                
                // Realizar la petición
                const response = await fetch('/uploadDocs', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error ${response.status}: ${errorText}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    mostrarMensaje(result.message, 'success');
                    
                    // Limpiar la lista de archivos
                    archivosParaSubir = [];
                    document.getElementById('filesList').innerHTML = '';
                    document.getElementById('btnSubmit').disabled = true;
                    document.getElementById('btnSubmit').innerHTML = '<i class="fas fa-upload"></i> Subir documentos';
                    document.getElementById('documentType').value = '';
                    
                } else {
                    throw new Error(result.message || 'Error al subir archivos');
                }
            } catch (error) {
                console.error('Error al subir archivos:', error);
                mostrarMensaje('Error al subir archivos: ' + error.message, 'error');
                document.getElementById('btnSubmit').disabled = false;
                document.getElementById('btnSubmit').innerHTML = '<i class="fas fa-upload"></i> Subir documentos';
            }
        }
        
        //===================================== SHOW MESSAGES =========================================
        function mostrarMensaje(mensaje, tipo) {
            const messageContainer = document.getElementById('messageContainer');
            const messageClass = tipo === 'error' ? 'error' : tipo === 'success' ? 'success' : 'info';
            messageContainer.innerHTML = `<div class="${messageClass} animate-fade-in">${mensaje}</div>`;
            
            // Auto-ocultar después de 5 segundos
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
