<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
      /* Fondo de gradiente abstracto */
      body {
        background: 
          radial-gradient(circle at 70% 30%, 
            rgba(181, 196, 19, 0.8) 0%, 
            rgba(41, 10, 89, 0.5) 30%, 
            transparent 60%),
          radial-gradient(circle at 30% 70%, 
            rgba(0, 119, 182, 0.7) 0%, 
            rgba(3, 4, 94, 0.4) 40%, 
            transparent 70%),
          radial-gradient(circle at center, 
            rgba(231, 29, 54, 0.6) 0%, 
            rgba(181, 196, 19, 0.3) 30%, 
            transparent 60%),
          linear-gradient(135deg, 
            #0f0c29 0%, 
            #302b63 50%, 
            #24243e 100%);
        min-height: 100vh;
        font-family: Inter, "Noto Sans", sans-serif;
        background-attachment: fixed;
      }
      
      /* Barra superior mejorada - 25% más grande */
      .glass-header {
        position: fixed;
        top: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 70%;
        height: 62.5px; /* 25% más grande que 50px */
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 
          0 8px 32px 0 rgba(31, 38, 135, 0.37),
          0 0 10px 1px rgba(255, 255, 255, 0.1);
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 25px;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        overflow: hidden;
      }
      
      /* Efecto liquid glass al pasar el mouse */
      .glass-header::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: 0.5s;
      }
      
      .glass-header:hover::before {
        left: 100%;
      }
      
      /* Burbuja liquid glass */
      .liquid-bubble {
        position: absolute;
        width: 120px;
        height: 40px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: -1;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      
      /* Efecto hover para los items del menú */
      .nav-item {
        position: relative;
        padding: 8px 16px;
        transition: color 0.3s ease;
      }
      
      .nav-item:hover {
        color: white !important;
      }
      
      .glass-panel {
        background: rgba(15, 12, 41, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .text-primary {
        color: #ffffff;
      }
      
      .text-secondary {
        color: rgba(255, 255, 255, 0.7);
      }
      
      .input-field {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
      }
      
      .input-field::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      
      /* Efecto de brillo al pasar el mouse */
      .hover-glow:hover {
        box-shadow: 0 0 15px rgba(181, 196, 19, 0.5);
      }
      
      /* Botones con efecto hover */
      .glass-button {
        background: rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
      }
      
      .glass-button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      
      .reject-button {
        background: rgba(231, 29, 54, 0.3);
      }
      
      .reject-button:hover {
        background: rgba(231, 29, 54, 0.4);
      }
      
      .approve-button {
        background: rgba(181, 196, 19, 0.75);
      }
      
      .approve-button:hover {
        background: rgba(181, 196, 19, 0.9);
      }
    </style>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
  <body>
    <!-- Barra superior rediseñada -->
    <header class="glass-header" id="mainHeader">
      <div class="flex items-center gap-8 relative">
        <!-- Burbuja liquid glass -->
        <div class="liquid-bubble" id="liquidBubble"></div>
        
        <div class="flex items-center gap-4 text-primary">

        </div>
        <div class="flex items-center gap-9">

            <a class="nav-item text-secondary text-sm font-bold leading-normal transition-colors" href="/mydocs">Documentos</a>
            <a class="nav-item text-secondary text-sm font-bold leading-normal transition-colors" href="/myfolders">Folders</a>
            <a class="nav-item text-secondary text-sm font-bold leading-normal transition-colors" href="/mykeys">Mis llaves</a>
            <a class="nav-item text-white text-sm font-bold leading-normal transition-colors" href="/mytemplates">Plantillas</a>
        </div>
      </div>
      <div class="flex flex-1 justify-end gap-8">
        <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-8 bg-white/20 text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5 hover:bg-white/30 hover-glow">
          <svg xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z"></path>
          </svg>
        </button>
        <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-8 border-2 border-white/30" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA5pz3IzKhLNRISosqK1_TRvPN-3rk_ZmzGfDkkcG4Mg1z3mILEAytDJgWzSO8cmrO0eq9iCkZuTmFjXGdh6mTqmXg0Us_wcN3tGL7aPzXF2XsaJ5RLoy2HbDz-Zc5ymdat1orMi-IPvJklxyVNCE1fO8kpRmW40vmkynjxMCUfliJhlQ3WxyuwJGAcBoqClEy1D7awe_c-yADYZZu5GORao2DTqSl_eJvPYy3ijxHRsePVd9CAfWsCclVHVp7iL8iilgQjpcJovY8");'></div>
      </div>

    <!-- Contenido principal con márgenes laterales de 100px -->
    <div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden pt-20 px-[100px]">
      <div class="layout-container flex h-full grow flex-col">
        <div class="gap-1 flex flex-1 justify-center py-5">
          <!-- Panel principal centrado -->

              Please review the document below and approve or reject it. You can add comments to provide feedback.
            </p>

              <div
                class="relative flex items-center justify-center bg-cover bg-center aspect-video rounded-xl glass-card overflow-hidden"

              >
                <button class="flex shrink-0 items-center justify-center rounded-full size-16 bg-black/40 text-white hover:bg-black/60 transition-all">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                    <path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"></path>
                  </svg>
                </button>
              </div>
            </div>
            
            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <textarea
                  placeholder="Add comments"
                  class="input-field flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl focus:outline-0 focus:ring-0 focus:border-white/40 min-h-36 p-[15px] text-base font-normal leading-normal"
                ></textarea>
              </label>
            </div>
            
            <div class="flex justify-stretch px-4 pb-6">
              <div class="flex flex-1 gap-3 flex-wrap justify-end">
                <button
                  class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 reject-button text-primary text-sm font-bold leading-normal tracking-[0.015em] hover-glow"
                >
                  <span class="truncate">Reject</span>
                </button>
                <button
                  class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 approve-button text-primary text-sm font-bold leading-normal tracking-[0.015em] hover-glow"
                >
                  <span class="truncate">Approve</span>

            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Efecto liquid glass para la burbuja del menú
      const liquidBubble = document.getElementById('liquidBubble');
      const navItems = document.querySelectorAll('.nav-item');
      
      // Posiciones iniciales de los items del menú
      const itemPositions = {};
      
      // Calcular posiciones de los items
      function calculatePositions() {
        navItems.forEach(item => {
          const rect = item.getBoundingClientRect();
          const headerRect = document.getElementById('mainHeader').getBoundingClientRect();
          
          itemPositions[item.dataset.item] = {
            left: rect.left - headerRect.left,
            width: rect.width
          };
        });
        
        // Posicionar burbuja en el item activo (home por defecto)
        moveBubble('home');
      }
      
      // Mover la burbuja al item seleccionado
      function moveBubble(itemName) {
        const item = itemPositions[itemName];
        if (item) {
          liquidBubble.style.left = `${item.left - 10}px`;
          liquidBubble.style.width = `${item.width + 20}px`;
        }
      }
      
      // Event listeners para los items del menú
      navItems.forEach(item => {
        item.addEventListener('mouseenter', () => {
          moveBubble(item.dataset.item);
        });
        
        item.addEventListener('click', (e) => {
          e.preventDefault();
          moveBubble(item.dataset.item);
          // Aquí podrías añadir lógica para cambiar de vista
        });
      });
      
      // Calcular posiciones al cargar y al redimensionar
      window.addEventListener('load', calculatePositions);
      window.addEventListener('resize', calculatePositions);
    </script>
