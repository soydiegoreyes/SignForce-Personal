<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link rel="stylesheet" as="style" onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />
    <link rel="stylesheet" href="email_sign_request.css"/>

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="email_sign_request.js"></script>
  </head>
  <body>
    <!-- Barra superior rediseñada -->
    <header class="glass-header" id="mainHeader">
      <div class="flex items-center gap-8 relative">
        <!-- Burbuja liquid glass -->
        <div class="liquid-bubble" id="liquidBubble"></div>
        
        <div class="flex items-center gap-4 text-primary">
          <div class="size-4">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M24 4C25.7818 14.2173 33.7827 22.2182 44 24C33.7827 25.7818 25.7818 33.7827 24 44C22.2182 33.7827 14.2173 25.7818 4 24C14.2173 22.2182 22.2182 14.2173 24 4Z"
                fill="currentColor"
              ></path>
            </svg>
          </div>
          <h2 class="text-primary text-lg font-bold leading-tight tracking-[-0.015em]">SignForce</h2>
        </div>
        <div class="flex items-center gap-9">
          <a class="nav-item text-secondary text-sm font-medium leading-normal transition-colors" href="#" data-item="home">Home</a>
          <a class="nav-item text-secondary text-sm font-medium leading-normal transition-colors" href="#" data-item="documents">Documents</a>
          <a class="nav-item text-secondary text-sm font-medium leading-normal transition-colors" href="#" data-item="templates">Templates</a>
          <a class="nav-item text-secondary text-sm font-medium leading-normal transition-colors" href="#" data-item="reports">Reports</a>
          <a class="nav-item text-secondary text-sm font-medium leading-normal transition-colors" href="#" data-item="people">People</a>
        </div>
      </div>
      <div class="flex flex-1 justify-end gap-8">
        <button class="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-8 bg-white/20 text-white gap-2 text-sm font-bold leading-normal tracking-[0.015em] min-w-0 px-2.5 hover:bg-white/30 hover-glow">
          <svg xmlns="http://www.w3.org/2000/svg" width="16px" height="16px" fill="currentColor" viewBox="0 0 256 256">
            <path d="M221.8,175.94C216.25,166.38,208,139.33,208,104a80,80,0,1,0-160,0c0,35.34-8.26,62.38-13.81,71.94A16,16,0,0,0,48,200H88.81a40,40,0,0,0,78.38,0H208a16,16,0,0,0,13.8-24.06ZM128,216a24,24,0,0,1-22.62-16h45.24A24,24,0,0,1,128,216ZM48,184c7.7-13.24,16-43.92,16-80a64,64,0,1,1,128,0c0,36.05,8.28,66.73,16,80Z"></path>
          </svg>
        </button>
        <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-8 border-2 border-white/30" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA5pz3IzKhLNRISosqK1_TRvPN-3rk_ZmzGfDkkcG4Mg1z3mILEAytDJgWzSO8cmrO0eq9iCkZuTmFjXGdh6mTqmXg0Us_wcN3tGL7aPzXF2XsaJ5RLoy2HbDz-Zc5ymdat1orMi-IPvJklxyVNCE1fO8kpRmW40vmkynjxMCUfliJhlQ3WxyuwJGAcBoqClEy1D7awe_c-yADYZZu5GORao2DTqSl_eJvPYy3ijxHRsePVd9CAfWsCclVHVp7iL8iilgQjpcJovY8");'></div>
      </div>
    </header>

    <!-- Contenido principal con márgenes laterales de 100px -->
    <div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden pt-20 px-[100px]">
      <div class="layout-container flex h-full grow flex-col">
        <div class="gap-1 flex flex-1 justify-center py-5">
          <!-- Panel principal centrado -->
          <div class="layout-content-container flex flex-col w-[512px] max-w-[512px] glass-panel">
            <h2 class="text-primary tracking-light text-[28px] font-bold leading-tight px-4 text-left pb-3 pt-5">Review Document</h2>
            <p class="text-secondary text-base font-normal leading-normal pb-3 pt-1 px-4">
              Please review the document below and approve or reject it. You can add comments to provide feedback.
            </p>
            
            <div class="p-4">
              <div
                class="relative flex items-center justify-center bg-cover bg-center aspect-video rounded-xl glass-card overflow-hidden"
                style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBHpvx3ArEAm2B94-aeLhfGJ-Ajc6dquI8hHtWxHKvyNcTPA1rcvbhM-xWTGnFBo_6abF973llqOFzBir_OtLxBw-nPVInzrGoqNWA52LH9RZe38bSwk521MKU1GGcS8tu8U_dla_gjuKSKlVJaZ0vigGwM8VKZ1znX4AWsVVqdNzUiS88L6JND-pndyei4cLww5QyPoCFTcYHVRgDV8PF4n5ZDwuNkwaq7jlvDZZjDRDrwFo-CW-EPLyUQXjPDGJXKdjeMdqp0Eks");'
              >
                <button class="flex shrink-0 items-center justify-center rounded-full size-16 bg-black/40 text-white hover:bg-black/60 transition-all">
                  <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                    <path d="M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z"></path>
                  </svg>
                </button>
              </div>
            </div>
            
            <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
              <label class="flex flex-col min-w-40 flex-1">
                <textarea
                  placeholder="Add comments"
                  class="input-field flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl focus:outline-0 focus:ring-0 focus:border-white/40 min-h-36 p-[15px] text-base font-normal leading-normal"
                ></textarea>
              </label>
            </div>
            
            <div class="flex justify-stretch px-4 pb-6">
              <div class="flex flex-1 gap-3 flex-wrap justify-end">
                <button
                  class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 reject-button text-primary text-sm font-bold leading-normal tracking-[0.015em] hover-glow"
                >
                  <span class="truncate">Reject</span>
                </button>
                <button
                  class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 approve-button text-primary text-sm font-bold leading-normal tracking-[0.015em] hover-glow"
                >
                  <span class="truncate">Approve</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
