<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <style>
      /* Fondo de gradiente abstracto */
      body {
        background: 
          radial-gradient(circle at 70% 30%, 
            rgba(155, 81, 224, 0.8) 0%, 
            rgba(41, 10, 89, 0.5) 30%, 
            transparent 60%),
          radial-gradient(circle at 30% 70%, 
            rgba(0, 119, 182, 0.7) 0%, 
            rgba(3, 4, 94, 0.4) 40%, 
            transparent 70%),
          radial-gradient(circle at center, 
            rgba(231, 29, 54, 0.6) 0%, 
            rgba(131, 56, 236, 0.3) 30%, 
            transparent 60%),
          linear-gradient(135deg, 
            #0f0c29 0%, 
            #302b63 50%, 
            #24243e 100%);
        min-height: 100vh;
        font-family: Inter, "Noto Sans", sans-serif;
        background-attachment: fixed;
      }
      
      /* Barra superior mejorada - 25% más grande */
      .glass-header {
        position: fixed;
        top: 25px;
        left: 50%;
        transform: translateX(-50%);
        width: 70%;
        height: 62.5px; /* 25% más grande que 50px */
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-radius: 50px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 
          0 8px 32px 0 rgba(31, 38, 135, 0.37),
          0 0 10px 1px rgba(255, 255, 255, 0.1);
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 25px;
        transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        overflow: hidden;
      }
      
      /* Efecto liquid glass al pasar el mouse */
      .glass-header::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: 0.5s;
      }
      
      .glass-header:hover::before {
        left: 100%;
      }
      
      /* Burbuja liquid glass */
      .liquid-bubble {
        position: absolute;
        width: 120px;
        height: 40px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 20px;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: -1;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      
      /* Efecto hover para los items del menú */
      .nav-item {
        position: relative;
        padding: 8px 16px;
        transition: color 0.3s ease;
      }
      
      .nav-item:hover {
        color: white !important;
      }
      
      .glass-panel {
        background: rgba(15, 12, 41, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      .text-primary {
        color: #ffffff;
      }
      
      .text-secondary {
        color: rgba(255, 255, 255, 0.7);
      }
      
      .input-field {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
      }
      
      .input-field::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }
      
      /* Efecto de brillo al pasar el mouse */
      .hover-glow:hover {
        box-shadow: 0 0 15px rgba(155, 81, 224, 0.5);
      }
      
      /* Botones con efecto hover */
      .glass-button {
        background: rgba(255, 255, 255, 0.1);
        transition: all 0.3s ease;
      }
      
      .glass-button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      
      .reject-button {
        background: rgba(231, 29, 54, 0.3);
      }
      
      .reject-button:hover {
        background: rgba(231, 29, 54, 0.4);
      }
      
      .approve-button {
        background: rgba(229, 117, 25, 0.6);
      }
      
      .approve-button:hover {
        background: rgba(229, 117, 25, 0.7);
      }
    
    /* ═══ SignForce Design Override ═══ */
    body { background: #060a14 !important; font-family: 'DM Sans', sans-serif !important; color: #fff; margin: 0; min-height: 100vh; }
    body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.025) 1px, transparent 0); background-size: 48px 48px; }
    h1,h2,h3,h4,h5 { font-family: 'DM Sans', sans-serif !important; color: #fff !important; }
    p { color: rgba(255,255,255,.6) !important; }
    .glass-header { position:fixed !important; top:3px !important; left:0 !important; right:0 !important;
      width:100% !important; transform:none !important; border-radius:0 !important; height:60px !important;
      background:rgba(10,15,30,.85) !important; backdrop-filter:blur(24px) !important;
      border:none !important; border-bottom:1px solid rgba(255,255,255,.06) !important;
      box-shadow:none !important; padding:0 1.5rem !important; }
    .glass-header::before { display:none !important; }
    .liquid-bubble { position:absolute; height:32px; background:rgba(181,196,19,.08); border-radius:8px;
      transition:all .4s cubic-bezier(.68,-.55,.265,1.55); z-index:-1; border:1px solid rgba(181,196,19,.12); box-shadow:none; }
    .glass-panel { background:rgba(15,21,36,.45) !important; backdrop-filter:blur(16px) !important;
      border:1px solid rgba(255,255,255,.06) !important; border-radius:20px !important; box-shadow:0 4px 20px rgba(0,0,0,.3) !important; }
    .glass-card { background:rgba(255,255,255,.03) !important; border:1px solid rgba(255,255,255,.06) !important;
      border-radius:14px !important; transition:all .3s ease; }
    .glass-card:hover { background:rgba(181,196,19,.04) !important; border-color:rgba(181,196,19,.15) !important; transform:translateY(-2px); }
    .sidebar, aside { background:rgba(10,15,30,.5) !important; }
    .sidebar nav a[class*="bg-gradient"], aside nav a[class*="bg-gradient"] {
      background:rgba(181,196,19,.08) !important; color:#B5C413 !important; border:1px solid rgba(181,196,19,.12) !important; }
    .btn-primary, .btn { background:#B5C413 !important; color:#0a0f1e !important; font-weight:700; border-radius:10px !important; border:none; }
    .btn-primary:hover, .btn:hover { background:#c5d41a !important; box-shadow:0 0 24px rgba(181,196,19,.2) !important; }
    .btn-secondary { background:rgba(255,255,255,.06) !important; color:#fff !important;
      border:1px solid rgba(255,255,255,.1) !important; border-radius:10px !important; }
    .btn-secondary:hover { background:rgba(255,255,255,.1) !important; border-color:rgba(181,196,19,.2) !important; }
    .input-field, input[type="text"], input[type="email"], input[type="password"], input[type="tel"],
    input[type="date"], input[type="file"], textarea, select {
      background:rgba(255,255,255,.04) !important; border:1px solid rgba(255,255,255,.08) !important;
      color:#fff !important; border-radius:10px !important; font-family:'DM Sans',sans-serif; }
    input:focus, textarea:focus, select:focus, .input-field:focus {
      outline:none !important; border-color:#B5C413 !important; box-shadow:0 0 0 3px rgba(181,196,19,.1) !important; }
    input::placeholder, textarea::placeholder { color:rgba(255,255,255,.2) !important; }
    select option { background:#0f1524; color:#fff; }
    table { width:100%; border-collapse:collapse; }
    th { background:rgba(255,255,255,.03) !important; font-size:.7rem; font-weight:600; color:rgba(255,255,255,.4);
      text-transform:uppercase; letter-spacing:.08em; padding:.65rem 1rem; border-bottom:1px solid rgba(255,255,255,.06); }
    td { padding:.65rem 1rem; border-bottom:1px solid rgba(255,255,255,.04); color:rgba(255,255,255,.6); font-size:.85rem; }
    tr:hover td { background:rgba(255,255,255,.02); }
    .badge { padding:4px 10px; border-radius:20px; font-size:.68rem; font-weight:600; }
    .action-card { background:rgba(15,21,36,.4) !important; border:1px solid rgba(255,255,255,.06) !important;
      border-radius:20px !important; cursor:pointer; transition:all .3s ease; }
    .action-card:hover { border-color:rgba(181,196,19,.15) !important; transform:translateY(-3px); }
    .modal { display:none; position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,.7); backdrop-filter:blur(5px); }
    .modal-content { background:rgba(10,15,30,.96) !important; border:1px solid rgba(255,255,255,.08) !important;
      border-radius:20px !important; }
    .close-modal { color:rgba(255,255,255,.4); cursor:pointer; transition:.2s; }
    .close-modal:hover { color:#fff; }
    .spinner { border:3px solid rgba(255,255,255,.08); border-top-color:#B5C413; border-radius:50%;
      width:30px; height:30px; animation:spin .7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .bg { background:none !important; }
    .main-container, .content, main { position:relative; z-index:1; }
    .hover-glow:hover { box-shadow:0 0 15px rgba(181,196,19,.12) !important; }
    .text-primary { color:#fff !important; }
    .text-secondary { color:rgba(255,255,255,.55) !important; }
    .drag-drop-area { border:2px dashed rgba(181,196,19,.2) !important; background:rgba(181,196,19,.03) !important; border-radius:16px; }
    .drag-drop-area:hover { border-color:rgba(181,196,19,.35) !important; }
    .footer, footer { background:rgba(10,15,30,.4) !important; border:1px solid rgba(255,255,255,.04) !important; border-radius:14px; }
    
    /* Hero gradient line on panels */
    .glass-panel { position: relative !important; overflow: hidden; }
    .glass-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(181,196,19,.2), transparent);
      pointer-events: none; z-index: 1;
    }
    .glass-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(181,196,19,.1), transparent);
      pointer-events: none;
    }

    /* end override */

    </style>

    <script>
      // Efecto liquid glass para la burbuja del menú
      const liquidBubble = document.getElementById('liquidBubble');
      const navItems = document.querySelectorAll('.nav-item');
      
      // Posiciones iniciales de los items del menú
      const itemPositions = {};
      
      // Calcular posiciones de los items
      function calculatePositions() {
        navItems.forEach(item => {
          const rect = item.getBoundingClientRect();
          const headerRect = document.getElementById('mainHeader').getBoundingClientRect();
          
          itemPositions[item.dataset.item] = {
            left: rect.left - headerRect.left,
            width: rect.width
          };
        });
        
        // Posicionar burbuja en el item activo (home por defecto)
        moveBubble('home');
      }
      
      // Mover la burbuja al item seleccionado
      function moveBubble(itemName) {
        const item = itemPositions[itemName];
        if (item) {
          liquidBubble.style.left = `${item.left - 10}px`;
          liquidBubble.style.width = `${item.width + 20}px`;
        }
      }
      
      // Event listeners para los items del menú
      navItems.forEach(item => {
        item.addEventListener('mouseenter', () => {
          moveBubble(item.dataset.item);
        });
        
        item.addEventListener('click', (e) => {
          e.preventDefault();
          moveBubble(item.dataset.item);
          // Aquí podrías añadir lógica para cambiar de vista
        });
      });
      
      // Calcular posiciones al cargar y al redimensionar
      window.addEventListener('load', calculatePositions);
      window.addEventListener('resize', calculatePositions);
    </script>
