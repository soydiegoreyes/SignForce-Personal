<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div class="size-12">
        <img src="./../images/sflogo.png" alt="Logo" />
    </div>
    <title>Acceso No Autorizado – SignForce</title>

    <!-- Fuentes e íconos -->
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?display=swap&family=Inter:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700;900" />
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tu CSS propio (el mismo que usas en waitapprove.html) -->
    <link rel="stylesheet" href="/registro/login.css">

    <!-- Tailwind (para utilidades rápidas) -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
</head>

<body class="bg-gray-900 text-white">

    <!-- ---------- Cabecera ---------- -->
    <header class="glass-header p-4 flex justify-between items-center">
        <div class="flex items-center gap-4">
            <svg class="w-8 h-8 text-primary" viewBox="0 0 48 48" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M6 6H42L36 24L42 42H6L12 24L6 6Z" fill="currentColor"/>
            </svg>
            <h2 class="text-lg font-bold">SignForce</h2>
        </div>

        <nav class="flex gap-6">
            <a href="/" class="nav-item text-sm font-bold">Inicio</a>
            <a href="/payment" class="nav-item text-sm font-bold">Precios</a>
            <a href="/login" class="nav-item text-sm font-bold">Iniciar Sesión</a>
        </nav>
    </header>

    <!-- ---------- Contenedor principal ---------- -->
    <main class="flex items-center justify-center min-h-screen px-4">
        <section class="glass-panel max-w-lg w-full p-8 rounded-xl shadow-xl">
            <div class="text-center mb-6">
                <i class="fas fa-exclamation-triangle text-5xl text-yellow-300"></i>
                <h1 class="mt-4 text-2xl font-bold">Acceso No Autorizado</h1>
                <p class="mt-2 text-gray-300">Tu sesión no tiene permiso para ver este recurso.</p>
            </div>

            <!-- Aquí insertaremos la respuesta de la API -->
            <div id="apiResult"
                 class="border border-gray-600 rounded p-4 bg-gray-800/50 text-center">
                <p class="text-gray-400">Cargando información…</p>
            </div>

            <div class="mt-6 text-center">
                <a href="/" class="inline-block px-4 py-2 bg-primary hover:bg-primary/80 rounded">
                    Volver al Inicio
                </a>
            </div>
        </section>
    </main>

    <!-- ---------- Footer ---------- -->
    <footer class="glass-panel py-4 text-center mt-8">
        <p class="text-sm text-gray-400">&copy; 2025 SignForce. Todos los derechos reservados.</p>
    </footer>

    <!-- ---------- Script de lógica ---------- -->
    <script>
        // -----------------------------------------------------------------
        // Configuración: cambia la URL a la de tu API real
        const API_URL = 'https://www.signforceglobal.com/';
        // -----------------------------------------------------------------

        /**
         * Renderiza el resultado de la llamada a la API.
         * @param {number} status   Código HTTP devuelto (ej. 401, 403, 500…)
         * @param {string} message Mensaje extraído del cuerpo JSON
         */
        function renderResult(status, message) {
            const container = document.getElementById('apiResult');
            container.innerHTML = `
                <p class="text-xl font-semibold mb-2">Código: ${status}</p>
                <p class="text-lg">${message}</p>
            `;
        }

        /**
         * Lanza la petición fetch y maneja errores de red / JSON.
        async function loadStatus() {
            try {
                const response = await fetch(API_URL, {
                    method: 'GET',
                    credentials: 'include'   // si necesitas cookies / auth headers
                });

                // Leemos el cuerpo como JSON (puede fallar si no es JSON)
                let data = {};
                try {
                    data = await response.json();
                } catch (_) {
                    // Si no hay JSON, usamos un mensaje genérico
                    data.message = response.statusText || 'Sin mensaje adicional';
                }

                // Mostramos lo que hemos obtenido
                renderResult(response.status, data.message ?? 'Sin mensaje');

            } catch (err) {
                // Errores de red o de CORS
                renderResult('Error', `No se pudo contactar la API: ${err.message}`);
            }
        }

        // Ejecutamos al cargar la página
        window.addEventListener('DOMContentLoaded', loadStatus);
        */
    </script>
</body>
</html>
