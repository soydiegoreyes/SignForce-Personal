<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Documentos - SignForce</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos Base y Scrollbar */
        .keys-list {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(181, 196, 19, 0.3) transparent;
            padding-right: 5px;
        }
        
        .keys-list::-webkit-scrollbar { width: 4px; }
        .keys-list::-webkit-scrollbar-track { background: transparent; }
        .keys-list::-webkit-scrollbar-thumb {
            background-color: rgba(181, 196, 19, 0.3);
            border-radius: 3px;
        }

        /* Tarjetas Estilo "Invitación" */
        .tech-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .tech-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(197, 212, 47, 0.5), transparent);
            opacity: 0.5;
        }

        .tech-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(197, 212, 47, 0.3);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        /* Contenedores de datos con resplandor */
        .sig-data-item {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .sig-data-item::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(181, 196, 19, 0.3), 
                rgba(138, 148, 16, 0.3), 
                rgba(181, 196, 19, 0.3));
            border-radius: 14px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sig-data-item:hover::before {
            opacity: 1;
        }

        .sig-data-item:hover {
            box-shadow: 0 0 20px rgba(181, 196, 19, 0.2);
            border-color: rgba(181, 196, 19, 0.4);
            transform: translateY(-2px);
        }

        /* Badges Neon */
        .badge-neon {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-validation {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.2);
        }

        .badge-document {
            background: rgba(181, 196, 19, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(181, 196, 19, 0.3);
        }

        /* Botones */
        .btn-cyber {
            background: linear-gradient(135deg, #B5C413, #8a9410);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            color: white;
            font-weight: 500;
        }
        
        .btn-cyber:hover {
            box-shadow: 0 0 20px rgba(138, 148, 16, 0.5);
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            color: white;
            font-weight: 500;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(181, 196, 19, 0.3);
        }

        /* Header Panel */
        .header-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            margin-bottom: 2px;
        }
        
        .info-value {
            font-weight: 600;
            color: #f3f4f6;
        }

        /* Estados de documentos */
        .status {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            min-width: 100px;
            text-align: center;
            border: 1px solid transparent;
        }

        .status-pendiente {
            background-color: rgba(249, 115, 22, 0.2);
            color: #f97316;
            border-color: rgba(249, 115, 22, 0.3);
        }

        .status-completo {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border-color: rgba(34, 197, 94, 0.3);
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        /* Inputs */
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05); /* Fondo transparente oscuro */
            border: 1px solid rgba(255, 255, 255, 0.1); /* Borde sutil */
            color: #f3f4f6; /* Texto claro */
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(181, 196, 19, 0.7); /* Borde azul al enfocar */
            box-shadow: 0 0 0 3px rgba(181, 196, 19, 0.2); /* Sombra azul sutil */
            background: rgba(255, 255, 255, 0.08); /* Fondo ligeramente más claro al enfocar */
            color: #ffffff; /* Texto blanco puro al enfocar */
        }

        .input-field::placeholder {
            color: rgba(156, 163, 175, 0.7); /* Placeholder gris translúcido */
            /* Quita el background del placeholder - no es necesario */
        }

        /* Si quieres que el input se vea aún más oscuro cuando no está enfocado */
        .input-field:not(:focus) {
            background: rgba(255, 255, 255, 0.03); /* Aún más oscuro cuando no está enfocado */
        }

        /* Mensajes */
        .message-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .message-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .message-info {
            background: rgba(181, 196, 19, 0.1);
            border: 1px solid rgba(181, 196, 19, 0.2);
            color: #93c5fd;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        /* Document items */
        .documento-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 0.75rem;
            transition: all 0.3s ease;
        }

        .documento-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(181, 196, 19, 0.3);
            transform: translateY(-2px);
        }

        .file-info {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-top: 0.25rem;
        }

        /* File input styling */
        .file-input-container {
            position: relative;
            display: inline-block;
        }

        .file-input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #B5C413;
            animation: spin 1s ease-in-out infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/home/signforce-global.css">
</head>
<body class="font-display bg-[#010102] text-gray-200 min-h-screen flex flex-col">

    <header class="header-panel fixed top-0 w-full z-50 h-16">
        <div class="h-full px-6 flex items-center justify-between max-w-[1920px] mx-auto">
            <div class="flex items-center gap-3">
                <div>
                    <img src="./../images/sflogo.png" alt="Logo" style="width: 20%;"/>
                </div>
                <!-- <h1 class="text-xl font-bold tracking-tight text-white">SignForce <span class="text-xs font-normal text-gray-400 ml-1">Validación de Documentos</span></h1> -->
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-xs font-medium">Conectado</span>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 pt-24 pb-8 px-4 md:px-8 max-w-[1200px] mx-auto w-full flex flex-col gap-8">
        
        <!-- Sección Principal - Información de la Empresa -->
        <div class="tech-card p-8 animate-fade-in">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                <div class="flex items-center gap-3">
                    <span class="badge-neon badge-validation">
                        <span class="material-symbols-outlined text-[14px">business</span>
                        Información de la Empresa
                    </span>
                </div>
            </div>

            <div id="messageContainer"></div>

            <div class="sig-data-item">
                <div id="empresaInfo" class="space-y-4">
                    <!-- Información se llenará con JS -->
                </div>
            </div>
        </div>

        <!-- Sección de Documentos Requeridos -->
        <div class="tech-card p-8 animate-fade-in">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <span class="material-symbols-outlined text-green-400">description</span>
                    Documentos Requeridos
                </h3>
                <div class="h-px flex-1 bg-white/10 ml-6"></div>
            </div>

            <div class="documentos-list space-y-4">
                <!-- Acta Constitutiva -->
                <div class="documento-item">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="material-symbols-outlined text-blue-400 text-lg">description</span>
                            <span class="font-medium text-white">Acta Constitutiva</span>
                        </div>
                        <div class="file-info" id="infoActa"></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="status status-pendiente" id="statusActa">Pendiente</span>
                        <div class="file-input-container">
                            <button id="btnActa" class="btn-cyber px-4 py-2 rounded-lg flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">upload</span>
                                Subir
                            </button>
                            <input type="file" class="file-input" id="fileActa" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                        </div>
                    </div>
                </div>

                <!-- Poder Notarial -->
                <div class="documento-item">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="material-symbols-outlined text-purple-400 text-lg">gavel</span>
                            <span class="font-medium text-white">Poder Notarial</span>
                        </div>
                        <div class="file-info" id="infoPoder"></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="status status-pendiente" id="statusPoder">Pendiente</span>
                        <div class="file-input-container">
                            <button id="btnPoder" class="btn-cyber px-4 py-2 rounded-lg flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">upload</span>
                                Subir
                            </button>
                            <input type="file" class="file-input" id="filePoder" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                        </div>
                    </div>
                </div>

                <!-- Identificación Oficial -->
                <div class="documento-item">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="material-symbols-outlined text-green-400 text-lg">badge</span>
                            <span class="font-medium text-white">Identificación Oficial</span>
                        </div>
                        <div class="file-info" id="infoIdentificacion"></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="status status-pendiente" id="statusIdentificacion">Pendiente</span>
                        <div class="file-input-container">
                            <button id="btnIdentificacion" class="btn-cyber px-4 py-2 rounded-lg flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">upload</span>
                                Subir
                            </button>
                            <input type="file" class="file-input" id="fileIdentificacion" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                        </div>
                    </div>
                </div>

                <!-- Comprobante de Domicilio -->
                <div class="documento-item">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="material-symbols-outlined text-orange-400 text-lg">home</span>
                            <span class="font-medium text-white">Comprobante de Domicilio</span>
                        </div>
                        <div class="file-info" id="infoDomicilio"></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="status status-pendiente" id="statusDomicilio">Pendiente</span>
                        <div class="file-input-container">
                            <button id="btnDomicilio" class="btn-cyber px-4 py-2 rounded-lg flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">upload</span>
                                Subir
                            </button>
                            <input type="file" class="file-input" id="fileDomicilio" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-white/10">
                <div class="flex justify-center">
                    <button class="btn-cyber px-8 py-3 rounded-lg text-white font-medium flex items-center gap-2 text-lg" id="btnCompletar" disabled>
                        <span class="material-symbols-outlined text-sm">check_circle</span>
                        Completar Validación
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/registro/validation.js"></script>
    <style>html,body{background:#060a14 !important;}</style>
</body>
</html>
