<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Documentos - SignForce</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos Base y Scrollbar */
        .keys-list {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(33, 150, 243, 0.3) transparent;
            padding-right: 5px;
        }
        
        .keys-list::-webkit-scrollbar { width: 4px; }
        .keys-list::-webkit-scrollbar-track { background: transparent; }
        .keys-list::-webkit-scrollbar-thumb {
            background-color: rgba(33, 150, 243, 0.3);
            border-radius: 3px;
        }

        /* Tarjetas Estilo "Invitación" */
        .tech-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .tech-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
            opacity: 0.5;
        }

        .tech-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        /* Contenedores de datos con resplandor */
        .sig-data-item {
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .sig-data-item::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, 
                rgba(59, 130, 246, 0.3), 
                rgba(124, 58, 237, 0.3), 
                rgba(59, 130, 246, 0.3));
            border-radius: 14px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sig-data-item:hover::before {
            opacity: 1;
        }

        .sig-data-item:hover {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
            border-color: rgba(33, 150, 243, 0.4);
            transform: translateY(-2px);
        }

        /* Badges Neon */
        .badge-neon {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-validation {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.2);
        }

        .badge-document {
            background: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        /* Botones */
        .btn-cyber {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            color: white;
            font-weight: 500;
        }
        
        .btn-cyber:hover {
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            color: white;
            font-weight: 500;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Header Panel */
        .header-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            margin-bottom: 2px;
        }
        
        .info-value {
            font-weight: 600;
            color: #f3f4f6;
        }

        /* Estados de documentos */
        .status {
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            min-width: 100px;
            text-align: center;
            border: 1px solid transparent;
        }

        .status-pendiente {
            background-color: rgba(249, 115, 22, 0.2);
            color: #f97316;
            border-color: rgba(249, 115, 22, 0.3);
        }

        .status-completo {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border-color: rgba(34, 197, 94, 0.3);
        }

        /* Animaciones */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        /* Inputs */
        .input-field {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05); /* Fondo transparente oscuro */
            border: 1px solid rgba(255, 255, 255, 0.1); /* Borde sutil */
            color: #f3f4f6; /* Texto claro */
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: rgba(59, 130, 246, 0.7); /* Borde azul al enfocar */
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); /* Sombra azul sutil */
            background: rgba(255, 255, 255, 0.08); /* Fondo ligeramente más claro al enfocar */
            color: #ffffff; /* Texto blanco puro al enfocar */
        }

        .input-field::placeholder {
            color: rgba(156, 163, 175, 0.7); /* Placeholder gris translúcido */
            /* Quita el background del placeholder - no es necesario */
        }

        /* Si quieres que el input se vea aún más oscuro cuando no está enfocado */
        .input-field:not(:focus) {
            background: rgba(255, 255, 255, 0.03); /* Aún más oscuro cuando no está enfocado */
        }

        /* Mensajes */
        .message-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .message-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .message-info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        /* Document items */
        .documento-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 0.75rem;
            transition: all 0.3s ease;
        }

        .documento-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }

        .file-info {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-top: 0.25rem;
        }

        /* File input styling */
        .file-input-container {
            position: relative;
            display: inline-block;
        }

        .file-input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #3b82f6;
            animation: spin 1s ease-in-out infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="font-display bg-[#0f172a] text-gray-200 min-h-screen flex flex-col">

    <header class="header-panel fixed top-0 w-full z-50 h-16">
        <div class="h-full px-6 flex items-center justify-between max-w-[1920px] mx-auto">
            <div class="flex items-center gap-3">
                <div class="size-12">
                    <img src="./../images/sflogo.png" alt="Logo" />
                </div>
                <h1 class="text-xl font-bold tracking-tight text-white">SignForce <span class="text-xs font-normal text-gray-400 ml-1">Validación de Documentos</span></h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-xs font-medium">Conectado</span>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 pt-24 pb-8 px-4 md:px-8 max-w-[1200px] mx-auto w-full flex flex-col gap-8">
        
        <!-- Sección Principal - Información de la Empresa -->
        <div class="tech-card p-8 animate-fade-in">
            <div class="flex flex-wrap items-center justify-between gap-4 mb-6">
                <div class="flex items-center gap-3">
                    <span class="badge-neon badge-validation">
                        <span class="material-symbols-outlined text-[14px">business</span>
                        Información de la Empresa
                    </span>
                </div>
            </div>

            <div id="messageContainer"></div>

            <div class="sig-data-item">
                <div id="empresaInfo" class="space-y-4">
                    <!-- Información se llenará con JS -->
                </div>
            </div>
        </div>

        <!-- Sección de Documentos Requeridos -->
        <div class="tech-card p-8 animate-fade-in">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <span class="material-symbols-outlined text-green-400">description</span>
                    Documentos Requeridos
                </h3>
                <div class="h-px flex-1 bg-white/10 ml-6"></div>
            </div>

            <div class="documentos-list space-y-4">
                <!-- Acta Constitutiva -->
                <div class="documento-item">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="material-symbols-outlined text-blue-400 text-lg">description</span>
                            <span class="font-medium text-white">Acta Constitutiva</span>
                        </div>
                        <div class="file-info" id="infoActa"></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="status status-pendiente" id="statusActa">Pendiente</span>
                        <div class="file-input-container">
                            <button id="btnActa" class="btn-cyber px-4 py-2 rounded-lg flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">upload</span>
                                Subir
                            </button>
                            <input type="file" class="file-input" id="fileActa" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                        </div>
                    </div>
                </div>

                <!-- Poder Notarial -->
                <div class="documento-item">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="material-symbols-outlined text-purple-400 text-lg">gavel</span>
                            <span class="font-medium text-white">Poder Notarial</span>
                        </div>
                        <div class="file-info" id="infoPoder"></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="status status-pendiente" id="statusPoder">Pendiente</span>
                        <div class="file-input-container">
                            <button id="btnPoder" class="btn-cyber px-4 py-2 rounded-lg flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">upload</span>
                                Subir
                            </button>
                            <input type="file" class="file-input" id="filePoder" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                        </div>
                    </div>
                </div>

                <!-- Identificación Oficial -->
                <div class="documento-item">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="material-symbols-outlined text-green-400 text-lg">badge</span>
                            <span class="font-medium text-white">Identificación Oficial</span>
                        </div>
                        <div class="file-info" id="infoIdentificacion"></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="status status-pendiente" id="statusIdentificacion">Pendiente</span>
                        <div class="file-input-container">
                            <button id="btnIdentificacion" class="btn-cyber px-4 py-2 rounded-lg flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">upload</span>
                                Subir
                            </button>
                            <input type="file" class="file-input" id="fileIdentificacion" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                        </div>
                    </div>
                </div>

                <!-- Comprobante de Domicilio -->
                <div class="documento-item">
                    <div class="flex-1">
                        <div class="flex items-center gap-3 mb-2">
                            <span class="material-symbols-outlined text-orange-400 text-lg">home</span>
                            <span class="font-medium text-white">Comprobante de Domicilio</span>
                        </div>
                        <div class="file-info" id="infoDomicilio"></div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="status status-pendiente" id="statusDomicilio">Pendiente</span>
                        <div class="file-input-container">
                            <button id="btnDomicilio" class="btn-cyber px-4 py-2 rounded-lg flex items-center gap-2">
                                <span class="material-symbols-outlined text-sm">upload</span>
                                Subir
                            </button>
                            <input type="file" class="file-input" id="fileDomicilio" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                        </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-6 border-t border-white/10">
                <div class="flex justify-center">
                    <button class="btn-cyber px-8 py-3 rounded-lg text-white font-medium flex items-center gap-2 text-lg" id="btnCompletar" disabled>
                        <span class="material-symbols-outlined text-sm">check_circle</span>
                        Completar Validación
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mapeo de tipos de documentos a las propiedades de la respuesta
        const documentTypes = {
            'acta': 'docActa',
            'poder': 'docPoder',
            'identificacion': 'docIdentidad',
            'domicilio': 'docResidencia'
        };

        // Estado de documentos
        let documentos = {
            acta: { subido: false, archivo: null, nombre: '' },
            poder: { subido: false, archivo: null, nombre: '' },
            identificacion: { subido: false, archivo: null, nombre: '' },
            domicilio: { subido: false, archivo: null, nombre: '' }
        };

        // Información de la empresa
        let empresa = null;

        // Al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            // Obtener datos de validación
            obtenerDatosValidacion();
            
            // Configurar event listeners para los inputs de archivo
            configurarEventListeners();
            
            // Configurar el botón de completar validación
            document.getElementById('btnCompletar').addEventListener('click', completarValidacion);
            
        });

        //===================================== GET DATA VALIDATION =========================================
        async function obtenerDatosValidacion() {
            try {
                mostrarMensaje('Cargando datos de validación...', 'info');
                
                const response = await fetch('/getvaldata', {
                    method: 'GET',
                    credentials: 'include' // Incluir cookies para el JWT
                });
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log(data);
                // Actualizar la interfaz con los datos recibidos
                actualizarInterfaz(data);
                
                mostrarMensaje('Datos cargados correctamente', 'success');
            } catch (error) {
                console.error('Error al obtener datos de validación:', error);
                mostrarMensaje('Error al cargar los datos: ' + error.message, 'error');
            }
        }

        //===================================== UPDATE DATA INTERFACE =========================================
        function actualizarInterfaz(data) {
            
            // Actualizar información de la empresa
            const inputline = '<div class="mb-4"><label class="info-label">{1}</label><input type="text" id="{0}" class="input-field" placeholder="{1}" value="{2}"></div>';
            
            document.getElementById('empresaInfo').innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                        <div>
                            <p class="info-label">Razón Social</p>
                            <p class="info-value">${data.legalName?data.legalName:'No especificado'}</p>
                        </div>
                        <div>
                            <p class="info-label">Alias</p>
                            <p class="info-value">${data.aliasName?data.aliasName:'No especificado'}</p>
                        </div>
                        <div>
                            <p class="info-label">RFC</p>
                            <p class="info-value">${data.taxNum?data.taxNum:'No especificado'}</p>
                        </div>
                        <div>
                            <p class="info-label">Representante Legal</p>
                            <p class="info-value">${data.legalSignupName?data.legalSignupName + ' ' + (data.legalSignupLastname || '') :'No especificado'}</p>
                        </div>
                    
                </div>
                
                <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                    ${inputline.format("street-address", "Calle y Número", data.streetAddress || '')}
                    ${inputline.format("neighborhood", "Colonia", data.neighborhood || '')}
                </div>
                <div class="space-y-4">
                    ${inputline.format("locality", "Delegación o Municipio", data.locality || '')}
                    ${inputline.format("postal-code", "Código Postal", data.postalCode || '')}
                </div>
                
                <div class="mt-8 pt-6 border-t border-white/10">
                    <div class="flex justify-end">
                        <button class="btn-cyber px-6 py-2 rounded-lg flex items-center gap-2" id="btnGuardarInfo">
                            <span class="material-symbols-outlined text-sm">save</span>
                            Guardar Información
                        </button>
                    </div>
                </div>
            `;
            
            // Configurar evento para guardar información
            document.getElementById('btnGuardarInfo').addEventListener('click', guardarInformacionTexto);
            
            for (const [key, value] of Object.entries(documentTypes)) {
                if (data[value]) {
                    // Documento ya existe, bloquear la subida
                    documentos[key].subido = true;
                    documentos[key].nombre = data[value];

                    // Construir IDs dinámicos
                    const capitalized = key.charAt(0).toUpperCase() + key.slice(1);

                    // Actualizar UI
                    const statusEl = document.getElementById(`status${capitalized}`);
                    statusEl.className = 'status status-completo';
                    statusEl.textContent = 'Completo';

                    // Cambiar el botón
                    const buttonEl = document.getElementById(`btn${capitalized}`);
                    if (buttonEl) {
                        buttonEl.textContent = 'Documento subido';
                        buttonEl.classList.remove('btn-cyber');
                        buttonEl.classList.add('btn-secondary');
                        buttonEl.disabled = true;
                    }

                    // Deshabilitar el input file real
                    document.getElementById(`file${capitalized}`).disabled = true;

                    // Mostrar información del archivo
                    document.getElementById(`info${capitalized}`).textContent = `Archivo: ${data[value]}`;
                }
            }
            
            // Verificar si todos los documentos están completos
            verificarCompletitud();
        }

        // Agregar esta función para recopilar datos de los inputs
        function recopilarDatosTexto() {
            const datos = {};
            
            // Obtener valores de todos los inputs de texto
            const inputs = document.querySelectorAll('#empresaInfo input');
            inputs.forEach(input => {
                switch(input.id) {
                    case 'street-address':
                        datos.streetAddress = input.value;
                        break;
                    case 'postal-code':
                        datos.postalCode = input.value;
                        break;
                    case 'neighborhood':
                        datos.neighborhood = input.value;
                        break;
                    case 'locality':
                        datos.locality = input.value;
                        break;
                }
            });
            
            return datos;
        }

        //===================================== UPLOAD DOCS =========================================
        function configurarEventListeners() {
            for (const key of Object.keys(documentTypes)) {
                const input = document.getElementById(`file${key.charAt(0).toUpperCase() + key.slice(1)}`);
                input.addEventListener('change', (event) => {
                    subirDocumento(key, event.target.files[0]);
                });
            }
        }

        // Función para subir un documento
        async function subirDocumento(tipo, archivo) {
            console.log(tipo);
            console.log(archivo);
            if (!archivo) return;
            
            try {
                mostrarMensaje(`Subiendo ${tipo}...`, 'info');
                
                const formData = new FormData();
                formData.append('documentType', documentTypes[tipo]);
                formData.append('document', archivo); // Este es el key que busca Go
                
                // Debug: ver qué se está enviando
                console.log('DocumentType value:', documentTypes[tipo]);
                console.log('Archivo name:', archivo.name);
                
                // También enviar datos de texto si existen
                const datosTexto = recopilarDatosTexto();
                for (const key in datosTexto) {
                    if (datosTexto[key]) {
                        formData.append(key, datosTexto[key]);
                    }
                }
                
                const response = await fetch('/updatevaldata', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Error ${response.status}: ${errorText}`);
                }
                
                const result = await response.json();
                console.log('Resultado:', result);
                mostrarMensaje('Documento subido exitosamente', 'success');
                
                // Actualizar estado del documento
                documentos[tipo].subido = true;
                documentos[tipo].archivo = archivo;
                documentos[tipo].nombre = archivo.name;
                
                // Actualizar UI
                const capitalized = tipo.charAt(0).toUpperCase() + tipo.slice(1);
                document.getElementById(`status${capitalized}`).className = 'status status-completo';
                document.getElementById(`status${capitalized}`).textContent = 'Completo';
                
                const buttonEl = document.getElementById(`btn${capitalized}`);
                buttonEl.textContent = 'Documento subido';
                buttonEl.classList.remove('btn-cyber');
                buttonEl.classList.add('btn-secondary');
                buttonEl.disabled = true;
                
                document.getElementById(`file${capitalized}`).disabled = true;
                document.getElementById(`info${capitalized}`).textContent = `Archivo: ${archivo.name}`;
                
                // Verificar si todos los documentos están completos
                verificarCompletitud();
                
                mostrarMensaje(`${tipo.charAt(0).toUpperCase() + tipo.slice(1)} subido correctamente`, 'success');
            } catch (error) {
                console.error(`Error al subir ${tipo}:`, error);
                mostrarMensaje(`Error al subir ${tipo}: ${error.message}`, 'error');
                
                // Limpiar el input de archivo
                document.getElementById(`file${tipo.charAt(0).toUpperCase() + tipo.slice(1)}`).value = '';
            }
        }

        // Función para guardar solo información de texto
        async function guardarInformacionTexto() {
            try {
                mostrarMensaje('Guardando información...', 'info');
                
                const datos = recopilarDatosTexto();
                const response = await fetch('/updatevaldata', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(datos)
                });
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                mostrarMensaje('Información guardada correctamente', 'success');
            } catch (error) {
                console.error('Error al guardar información:', error);
                mostrarMensaje('Error al guardar información: ' + error.message, 'error');
            }
        }

        //===================================== CHECK COMPLETE =========================================
        function verificarCompletitud() {
            const todosCompletos = Object.values(documentos).every(doc => doc.subido);
            document.getElementById('btnCompletar').disabled = !todosCompletos;
        }

        // Función para completar la validación
        async function completarValidacion() {
            try {
                mostrarMensaje('Completando validación...', 'info');
                
                const response = await fetch('/completevalidation', {
                    method: 'POST',
                    body: JSON.stringify({ status: true }),
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                
                mostrarMensaje('Validación completada con éxito', 'success');
                
                // Redirigir o mostrar mensaje de éxito
                setTimeout(() => {
                    window.location.href = '/waitapprove'; // Cambiar por la URL correcta
                }, 2000);
            } catch (error) {
                console.error('Error al completar validación:', error);
                mostrarMensaje('Error al completar validación: ' + error.message, 'error');
            }
        }

        //===================================== SHOW MESSAGES =========================================
        function mostrarMensaje(mensaje, tipo) {
            const messageContainer = document.getElementById('messageContainer');
            messageContainer.innerHTML = `<div class="message-${tipo}">${mensaje}</div>`;
            
            // Auto-ocultar después de 5 segundos
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 5000);
        }

        String.prototype.format = function () {
            const args = arguments;
            return this.replace(/{(\d+)}/g, function (match, number) {
                return typeof args[number] !== 'undefined' ? args[number] : match;
            });
        };
    </script>
</body>
