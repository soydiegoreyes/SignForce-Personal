<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validación de Documentos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        
        :root {
            --primary-color: #c643ee;
            --secondary-color: #7b37c9;
            --success-color: #4cc9f0;
            --warning-color: #f72585;
            --text-color: #333;
            --bg-color: #f8f9fa;
            --card-bg: #fff;
            --border-color: #dee2e6;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --text-color: #f8f9fa;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --border-color: #2d2d2d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.3s ease;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: var(--card-bg);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.5rem;
        }

        .logo i {
            margin-right: 0.5rem;
            font-size: 2rem;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.5rem;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .theme-toggle:hover {
            background-color: rgba(0, 0, 0, 0.1);
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
        }

        .empresa-info {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow);
        }

        .empresa-info h3 {
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .empresa-info p {
            margin-bottom: 0.5rem;
        }

        .form-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .form-tabs h3 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .documentos-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .documento-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
        }

        .documento-item span {
            font-weight: 500;
        }

        .status {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-right: 1rem;
        }

        .status-pendiente {
            background-color: #ffedd5;
            color: #f97316;
        }

        .status-completo {
            background-color: #dcfce7;
            color: #16a34a;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-upload {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-upload:hover {
            background-color: var(--secondary-color);
        }

        .btn-completar {
            background-color: var(--success-color);
            color: white;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
        }

        .btn-completar:hover:not(:disabled) {
            opacity: 0.9;
        }

        .btn-completar:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .actions {
            display: flex;
            justify-content: center;
        }

        .file-input-container {
            position: relative;
            display: inline-block;
        }

        .file-input {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-info {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #6b7280;
        }

        .error {
            color: #ef4444;
            padding: 1rem;
            background-color: #fef2f2;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .success {
            color: #16a34a;
            padding: 1rem;
            background-color: #f0fdf4;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body data-theme="dark">
    <!-- Header -->
    <header>
        <a href="#" class="logo">
            <i class="fas fa-signature"></i>
            <span>SignForce</span>
        </a>

        <nav class="nav-links">
            <a href="#cerrarSesion">Cerrar Sesión</a>
            <a href="#contact">Contacto</a>
        </nav>

        <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <div class="container">
        <h1>Validación de Documentos</h1>
        
        <div class="empresa-info" id="empresaInfo">
            <!-- Información de la empresa se llenará con JS -->
        </div>
        
        <div id="messageContainer"></div>
        
        <div class="form-container animate-form delay-1">
            <div class="form-tabs">
                <h3>Documentos Requeridos</h3>
                <div class="documentos-list">
                    <div class="documento-item">
                        <span>Acta Constitutiva</span>
                        <div>
                            <span class="status status-pendiente" id="statusActa">Pendiente</span>
                            <div class="file-input-container">
                                <button class="btn btn-upload" id="btnActa">Subir</button>
                                <input type="file" class="file-input" id="fileActa" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                            </div>
                            <div class="file-info" id="infoActa"></div>
                        </div>
                    </div>
                    <div class="documento-item">
                        <span>Poder Notarial</span>
                        <div>
                            <span class="status status-pendiente" id="statusPoder">Pendiente</span>
                            <div class="file-input-container">
                                <button class="btn btn-upload" id="btnPoder">Subir</button>
                                <input type="file" class="file-input" id="filePoder" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                            </div>
                            <div class="file-info" id="infoPoder"></div>
                        </div>
                    </div>
                    <div class="documento-item">
                        <span>Identificación Oficial</span>
                        <div>
                            <span class="status status-pendiente" id="statusIdentificacion">Pendiente</span>
                            <div class="file-input-container">
                                <button class="btn btn-upload" id="btnIdentificacion">Subir</button>
                                <input type="file" class="file-input" id="fileIdentificacion" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                            </div>
                            <div class="file-info" id="infoIdentificacion"></div>
                        </div>
                    </div>
                    <div class="documento-item">
                        <span>Comprobante de Domicilio</span>
                        <div>
                            <span class="status status-pendiente" id="statusDomicilio">Pendiente</span>
                            <div class="file-input-container">
                                <button class="btn btn-upload" id="btnDomicilio">Subir</button>
                                <input type="file" class="file-input" id="fileDomicilio" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
                            </div>
                            <div class="file-info" id="infoDomicilio"></div>
                        </div>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn btn-completar" id="btnCompletar" disabled>Completar Validación</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        // Mapeo de tipos de documentos a las propiedades de la respuesta
        const documentTypes = {
            'acta': 'docActa',
            'poder': 'docPoder',
            'identificacion': 'docIdentidad',
            'domicilio': 'docResidencia'
        };

        // Estado de documentos
        let documentos = {
            acta: { subido: false, archivo: null, nombre: '' },
            poder: { subido: false, archivo: null, nombre: '' },
            identificacion: { subido: false, archivo: null, nombre: '' },
            domicilio: { subido: false, archivo: null, nombre: '' }
        };

        // Información de la empresa
        let empresa = null;

        // Al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            // Obtener datos de validación
            obtenerDatosValidacion();
            
            // Configurar event listeners para los inputs de archivo
            configurarEventListeners();
            
            // Configurar el botón de completar validación
            document.getElementById('btnCompletar').addEventListener('click', completarValidacion);
            
            // Configurar el toggle del tema
            document.getElementById('themeToggle').addEventListener('click', toggleTema);
        });

        // Función para obtener datos de validación desde el endpoint
        async function obtenerDatosValidacion() {
            try {
                mostrarMensaje('Cargando datos de validación...', 'info');
                
                const response = await fetch('/getvaldata', {
                    method: 'GET',
                    credentials: 'include' // Incluir cookies para el JWT
                });
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log(data);
                // Actualizar la interfaz con los datos recibidos
                actualizarInterfaz(data);
                
                mostrarMensaje('Datos cargados correctamente', 'success');
            } catch (error) {
                console.error('Error al obtener datos de validación:', error);
                mostrarMensaje('Error al cargar los datos: ' + error.message, 'error');
            }
        }

        // Función para actualizar la interfaz con los datos recibidos
        function actualizarInterfaz(data) {
            // Actualizar información de la empresa
            document.getElementById('empresaInfo').innerHTML = `
                <h3>${data.legalName || 'Nombre no disponible'}</h3>
                <p><strong>Alias:</strong> ${data.aliasName || 'No especificado'}</p>
                <p><strong>RFC:</strong> ${data.taxNum || 'No especificado'}</p>
                <p><strong>Representante Legal:</strong> ${data.legalSignupName || ''} ${data.legalSignupLastname || ''}</p>
                <p><strong>Dirección:</strong> ${data.streetAddress || ''} ${data.addressLine || ''}</p>
                <p><strong>Código Postal:</strong> ${data.postalCode || ''}</p>
                <p><strong>Colonia:</strong> ${data.neighborhood || ''}</p>
                <p><strong>Localidad:</strong> ${data.locality || ''}</p>
            `;
            
            // Actualizar estado de los documentos
            for (const [key, value] of Object.entries(documentTypes)) {
                if (data[value]) {
                    // Documento ya existe, bloquear la subida
                    documentos[key].subido = true;
                    documentos[key].nombre = data[value];
                    
                    // Actualizar UI
                    document.getElementById(`status${key.charAt(0).toUpperCase() + key.slice(1)}`).className = 'status status-completo';
                    document.getElementById(`status${key.charAt(0).toUpperCase() + key.slice(1)}`).textContent = 'Completo';
                    document.getElementById(`btn${key.charAt(0).toUpperCase() + key.slice(1)}`).textContent = 'Documento subido';
                    document.getElementById(`btn${key.charAt(0).toUpperCase() + key.slice(1)}`).disabled = true;
                    document.getElementById(`file${key.charAt(0).toUpperCase() + key.slice(1)}`).disabled = true;
                    
                    // Mostrar información del archivo
                    document.getElementById(`info${key.charAt(0).toUpperCase() + key.slice(1)}`).textContent = `Archivo: ${data[value]}`;
                }
            }
            
            // Verificar si todos los documentos están completos
            verificarCompletitud();
        }

        // Configurar event listeners para los inputs de archivo
        function configurarEventListeners() {
            for (const key of Object.keys(documentTypes)) {
                const input = document.getElementById(`file${key.charAt(0).toUpperCase() + key.slice(1)}`);
                input.addEventListener('change', (event) => {
                    subirDocumento(key, event.target.files[0]);
                });
            }
        }

        // Función para subir un documento
        async function subirDocumento(tipo, archivo) {
            if (!archivo) return;
            
            try {
                mostrarMensaje(`Subiendo ${tipo}...`, 'info');
                
                // Crear FormData para enviar el archivo
                const formData = new FormData();
                formData.append('documentType', documentTypes[tipo]);
                formData.append('document', archivo);
                
                const response = await fetch('/updatevaldata', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                
                // Actualizar estado del documento
                documentos[tipo].subido = true;
                documentos[tipo].archivo = archivo;
                documentos[tipo].nombre = archivo.name;
                
                // Actualizar UI
                document.getElementById(`status${tipo.charAt(0).toUpperCase() + tipo.slice(1)}`).className = 'status status-completo';
                document.getElementById(`status${tipo.charAt(0).toUpperCase() + tipo.slice(1)}`).textContent = 'Completo';
                document.getElementById(`btn${tipo.charAt(0).toUpperCase() + tipo.slice(1)}`).textContent = 'Documento subido';
                document.getElementById(`btn${tipo.charAt(0).toUpperCase() + tipo.slice(1)}`).disabled = true;
                document.getElementById(`file${tipo.charAt(0).toUpperCase() + tipo.slice(1)}`).disabled = true;
                document.getElementById(`info${tipo.charAt(0).toUpperCase() + tipo.slice(1)}`).textContent = `Archivo: ${archivo.name}`;
                
                // Verificar si todos los documentos están completos
                verificarCompletitud();
                
                mostrarMensaje(`${tipo} subido correctamente`, 'success');
            } catch (error) {
                console.error(`Error al subir ${tipo}:`, error);
                mostrarMensaje(`Error al subir ${tipo}: ${error.message}`, 'error');
                
                // Limpiar el input de archivo
                document.getElementById(`file${tipo.charAt(0).toUpperCase() + tipo.slice(1)}`).value = '';
            }
        }

        // Función para verificar si todos los documentos están completos
        function verificarCompletitud() {
            const todosCompletos = Object.values(documentos).every(doc => doc.subido);
            document.getElementById('btnCompletar').disabled = !todosCompletos;
        }

        // Función para completar la validación
        async function completarValidacion() {
            try {
                mostrarMensaje('Completando validación...', 'info');
                
                const response = await fetch('/completevalidation', {
                    method: 'POST',
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                
                mostrarMensaje('Validación completada con éxito', 'success');
                
                // Redirigir o mostrar mensaje de éxito
                setTimeout(() => {
                    window.location.href = '/dashboard'; // Cambiar por la URL correcta
                }, 2000);
            } catch (error) {
                console.error('Error al completar validación:', error);
                mostrarMensaje('Error al completar validación: ' + error.message, 'error');
            }
        }

        // Función para mostrar mensajes
        function mostrarMensaje(mensaje, tipo) {
            const messageContainer = document.getElementById('messageContainer');
            messageContainer.innerHTML = `<div class="${tipo === 'error' ? 'error' : 'success'}">${mensaje}</div>`;
            
            // Auto-ocultar después de 5 segundos
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 5000);
        }

        // Función para cambiar el tema
        function toggleTema() {
            const body = document.body;
            const themeToggleIcon = document.querySelector('.theme-toggle i');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeToggleIcon.className = 'fas fa-sun';
            } else {
                body.setAttribute('data-theme', 'dark');
                themeToggleIcon.className = 'fas fa-moon';
            }
        }
    </script>
</body>
</html>
