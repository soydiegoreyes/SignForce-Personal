# ═══════════════════════════════════════════════════════════
# SignForce — Frontend-Only Docker Compose
# ═══════════════════════════════════════════════════════════
# Serves static frontend via Nginx on port 8090.
# Usage:    docker compose -f docker-compose.frontend.yml up -d
# ═══════════════════════════════════════════════════════════

version: '3.8'

services:
  signforce-web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: signforce-web
    ports:
      - "8080:80"
    restart: unless-stopped
    labels:
      - "app=signforce"
