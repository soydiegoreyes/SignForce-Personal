server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ═══ API calls → sfmiddle ═══
    location /loginUser      { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /logoutUser     { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /register       { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /uploadDocs     { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; client_max_body_size 100M; }
    location /downloadDoc    { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /statusDocs     { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /editDoc        { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /interactDoc    { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /uploadk        { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; client_max_body_size 10M; }
    location /statusk        { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /updatek        { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /logink         { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /logoutk        { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /getvaldata     { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /updatevaldata  { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; client_max_body_size 100M; }
    location /completevalidation { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /processpayment { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /approvalsDash  { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /newSignFolder  { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /closeInvite    { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /getinvite      { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /signDocument   { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /viewSign       { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /getAsice       { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /getfolders     { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /statusFolder   { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /inviteuser     { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /getinviteuser  { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /createuser     { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /updateUserStatus { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /findUser       { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /validateFace   { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /dashStats      { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }

    # ═══ Pages served by sfmiddle (server-side rendered) ═══
    location /login          { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /validation     { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /waitapprove    { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /users          { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /edituser       { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /upload         { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /mykeys         { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /payment        { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /approvals      { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /mydocs         { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /myfolders      { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /mytemplates    { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /addSigners     { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /addSignatures  { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /viewSignature  { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }
    location /viewinvite     { proxy_pass http://signforce-middle:5002; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Cookie $http_cookie; }

    # ═══ Landing page ═══
    location = / {
        try_files /index/index.html =404;
    }

    # ═══ Static assets from frontend ═══
    location /images/ { try_files $uri =404; }
    location /registro/ { try_files $uri =404; }
    location /dashboards/ { try_files $uri =404; }
    location /administracion/ { try_files $uri =404; }
    location /documentFlow/ { try_files $uri =404; }
    location /index/ { try_files $uri =404; }
    location /mobileapp/ { try_files $uri =404; }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|bin)$ {
        expires 30s;
        try_files $uri =404;
    }

    # ═══ Fallback ═══
    location / {
        try_files $uri $uri.html $uri/ /index/index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
    client_max_body_size 100M;
}
