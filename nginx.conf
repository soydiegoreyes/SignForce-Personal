server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Landing page
    location = / {
        try_files /index/index.html =404;
    }
    location /home/ {
        alias /usr/share/nginx/html/index/;
    }

    # Auth pages
    location /login {
        try_files /registro/login.html =404;
    }
    location /registro/ {
        try_files $uri $uri/ =404;
    }

    # Dashboards
    location /users {
        try_files /dashboards/dashboard_user.html =404;
    }

    # Static files
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other paths - try the file directly
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
