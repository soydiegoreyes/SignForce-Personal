server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ═══ Security Headers ═══
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ═══ Landing page ═══
    location = / {
        try_files /index/index.html =404;
    }
    location ^~ /home/ {
        # ^~ evita que la location regex de .css/.js capture estos paths
        # (servia 404 para /home/signforce-global.css)
        alias /usr/share/nginx/html/index/;
    }

    # ═══ Auth pages ═══
    location /login {
        try_files /registro/login.html =404;
    }
    location /registro/ {
        try_files $uri $uri/ =404;
    }

    # ═══ Flow pages (post-login redirects from sfmiddle) ═══
    location = /payment {
        try_files /registro/plan_pay.html =404;
    }
    location = /validation {
        try_files /registro/validation.html =404;
    }
    location = /waitapprove {
        try_files /registro/waitapprove.html =404;
    }
    location = /mykeys {
        try_files /registro/contracts.html =404;
    }
    location = /noAuthPage {
        try_files /registro/noauth.html =404;
    }

    # ═══ Dashboards ═══
    location = /users {
        try_files /dashboards/dashboard_user.html =404;
    }
    location = /admin {
        try_files /dashboards/dashboard_admin.html =404;
    }
    location = /approvals {
        try_files /dashboards/dashboard_approvals.html =404;
    }
    location = /rootpanel {
        try_files /dashboards/dashboard_root.html =404;
    }

    # ═══ Documents ═══
    location = /mydocs {
        try_files /documentFlow/upload_doc.html =404;
    }
    location = /documents {
        try_files /documentFlow/documents.html =404;
    }
    location = /folders {
        try_files /documentFlow/folders.html =404;
    }
    location = /templates {
        try_files /documentFlow/template_man.html =404;
    }

    location = /upload {
        try_files /documentFlow/upload_doc.html =404;
    }

    # ═══ Document Flow ═══
    location /documentFlow/ {
        try_files $uri $uri/ =404;
    }

    # ═══ Administration ═══
    location = /settings {
        try_files /administracion/settings.html =404;
    }
    location = /keys {
        try_files /administracion/mykeys.html =404;
    }
    location = /teams {
        try_files /administracion/crear_equipo.html =404;
    }
    location /administracion/ {
        try_files $uri $uri/ =404;
    }

    # ═══ Reports ═══
    location = /reports {
        try_files /dashboards/reports.html =404;
    }

    # ═══ Static assets — aggressive caching ═══
    location ~* \.(css|js|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Images — long cache
    location ~* \.(png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ═══ All other paths ═══
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # ═══ Custom 404 ═══
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # ═══ Gzip compression ═══
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;
}
