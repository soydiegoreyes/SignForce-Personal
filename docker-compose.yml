version: '3.8'

services:
  # ═══ MySQL Database ═══
  signforce-db:
    image: mysql:8.0
    container_name: signforce-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Xpressiceover1."
      MYSQL_DATABASE: signforceapi
    volumes:
      - signforce-db-data:/var/lib/mysql
      - ./signforce_db.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - signforce-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pXpressiceover1."]
      interval: 10s
      timeout: 5s
      retries: 10

  # ═══ Backend - Crypto/Signing API ═══
  signforce-back:
    build:
      context: ./sfback
      dockerfile: Dockerfile
    container_name: signforce-back
    restart: unless-stopped
    depends_on:
      signforce-db:
        condition: service_healthy
    environment:
      API_PORT: "5001"
      DB_USER: root
      DB_PASS: "Xpressiceover1."
      DB_IP: "signforce-db:3306"
      DB_NAME: signforceapi
      JWT_KEY: "tMP*[U|K1Ij>Gasg&2@oVS0Y7OzeR%k$|pk"
      JWT_ALG: "HS256"
      JWT_EXP: "480"
      EXP_LOGIN_TIME: "5"
      DIGEST_ALG: "sha256"
      ALLOWED_ALGS: "sha256"
      ALLOWED_SIGN_ALGS: "rsa-sha256"
      DOCS_KEY: "oVS0Y2@%k7OzR*[tMP>GaU|K1Ijsg&2@%$"
      BASE_DIR: "/app/data"
      GENERIC_FOLDER_PATH: "/app/data/folders"
      KEYS_PATH: "/app/data/keys"
      TEMP_BASE_PATH: "/app/data/temp"
      RECORD_PATH: "/app/data/records"
      QR_URL_BASE: "https://testsignforce.luxspace.org/"
      EMAIL_USER: "thelegendofmax19@gmail.com"
      EMAIL_DIR: "thelegendofmax19@gmail.com"
      EMAIL_PASS: "iuowwjcfqonkqyyf"
      SMTP_SERVER: "smtp.gmail.com"
    volumes:
      - signforce-data:/app/data
      - ./sfback/.env:/app/.env:ro
    networks:
      - signforce-net

  # ═══ Middleware - Web Gateway ═══
  signforce-middle:
    build:
      context: ./sfmiddle
      dockerfile: Dockerfile
    container_name: signforce-middle
    restart: unless-stopped
    depends_on:
      signforce-db:
        condition: service_healthy
      signforce-back:
        condition: service_started
    environment:
      API_PORT: "5002"
      DB_USER: root
      DB_PASS: "Xpressiceover1."
      DB_IP: "signforce-db:3306"
      DB_NAME: signforceapi
      JWT_KEY: "tMP*[U|K1Ij>Gasg&2@oVS0Y7OzeR%k$|pk"
      JWT_ALG: "HS256"
      JWT_EXP: "480"
      EXP_LOGIN_TIME: "5"
      DIGEST_ALG: "sha256"
      ALLOWED_ALGS: "sha256"
      ALLOWED_SIGN_ALGS: "rsa-sha256"
      DOCS_KEY: "oVS0Y2@%k7OzR*[tMP>GaU|K1Ijsg&2@%$"
      BACK_URL: "http://signforce-back:5001/"
      BASE_DIR: "/app/data"
      GENERIC_DOC_PATH: "/app/data/docs"
      TEMPLATE_DOC_PATH: "/app/data/templates"
      GENERIC_IMG_PATH: "/app/data/images"
      GENERIC_FOLDER_PATH: "/app/data/folders"
      KEYS_PATH: "/app/data/keys"
      TEMP_BASE_PATH: "/app/data/temp"
      RECORD_PATH: "/app/data/records"
      EMAIL_DIR: "/app/data/emails"
      MAX_UPLOAD_MEM: "104857600"
      QR_URL_BASE: "https://testsignforce.luxspace.org/"
      EMAIL_USER: "thelegendofmax19@gmail.com"
      EMAIL_PASS: "iuowwjcfqonkqyyf"
      SMTP_SERVER: "smtp.gmail.com"
    volumes:
      - signforce-data:/app/data
      - ./sffront:/app/frontend:ro
      - ./sffront:/sffront:ro
      - ./sfmiddle/.env:/app/.env:ro
      - ./sfmiddle/templates:/app/templates:ro
    ports:
      - "127.0.0.1:5002:5002"
    networks:
      - signforce-net

  # ═══ Frontend - Nginx ═══
  signforce-web:
    image: nginx:alpine
    container_name: signforce-web
    restart: unless-stopped
    depends_on:
      - signforce-middle
    volumes:
      - ./sffront:/usr/share/nginx/html:ro
      - ./nginx-full.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "0.0.0.0:8090:80"
    networks:
      - signforce-net


  # === Email Service ===
  signforce-email:
    build:
      context: ./emailServ
      dockerfile: Dockerfile
    container_name: signforce-email
    restart: unless-stopped
    depends_on:
      signforce-db:
        condition: service_healthy
    volumes:
      - ./emailServ/.env:/app/.env:ro
    networks:
      - signforce-net

volumes:
  signforce-db-data:
  signforce-data:

networks:
  signforce-net:
    driver: bridge
